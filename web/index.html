<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Learn every note on the guitar neck, step by step: open strings to the whole fretboard, bluegrass chords and boom-chuck, a tuner that listens, and a life-size neck.">
<meta name="theme-color" content="#EDF1F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fretwise">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fretwise</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: a luthier's bench. The instrument is rosewood, bone, nickel and pearl; a sunburst finish marks what's next; Lake Placid blue is every control.
   Phone: large title, content column, floating piano card, bottom tab bar. Desktop: same column, tabs move into the top bar. */
:root{
  --bg:#EDF1EF; --bg2:#E2E8E5; --surface:#FBFCFB; --ink:#141B19; --muted:#5D6A67; --line:#D5DDDA; --chip:#E2E8E5;
  --accent:#2B6A8C; --accent-ink:#FFFFFF; --accent-soft:rgba(43,106,140,.11); --amber:#C27A2C; --good:#2F8656; --bad:#C1463B;
  --glass:rgba(241,245,243,.78); --key-w:rgba(255,255,255,.9); --key-b:rgba(24,30,29,.88); --key-line:rgba(23,32,30,.22); --key-label:#5B6966;
  --wood-a:#4C2D1E; --wood-b:#2D1A12; --fretwire:#CBD2D5; --bone:#ECE4D1; --pearl:#F2EDE3; --string:#DCE1E3; --wound:#C4AB7A;
  --dot-ink:#1C1612; --on-wood:#D9CDBB; --shade:rgba(12,9,7,.58); --barre:rgba(242,237,227,.22);
  --burst:radial-gradient(125% 135% at 22% 12%, #F8CB74 0%, #E5953B 22%, #B85B21 46%, #5E2912 72%, #2A120A 100%);
  --burst-ink:#FFF6EA;
  --shadow:0 1px 2px rgba(20,27,25,.05), 0 10px 28px -16px rgba(20,27,25,.22);
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1211; --bg2:#141B1A; --surface:#161E1D; --ink:#E8EEEC; --muted:#93A39F; --line:#25302E; --chip:#1C2625;
  --accent:#7DB6D5; --accent-ink:#081820; --accent-soft:rgba(125,182,213,.14); --amber:#E5A55B; --good:#5FC28B; --bad:#E77A6E;
  --glass:rgba(13,18,17,.78); --key-w:rgba(232,237,235,.86); --key-b:rgba(6,9,9,.92); --key-line:rgba(0,0,0,.45); --key-label:#4E5B58;
  --wood-a:#3D2418; --wood-b:#20120C; --shade:rgba(5,4,3,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1211; --bg2:#141B1A; --surface:#161E1D; --ink:#E8EEEC; --muted:#93A39F; --line:#25302E; --chip:#1C2625;
  --accent:#7DB6D5; --accent-ink:#081820; --accent-soft:rgba(125,182,213,.14); --amber:#E5A55B; --good:#5FC28B; --bad:#E77A6E;
  --glass:rgba(13,18,17,.78); --key-w:rgba(232,237,235,.86); --key-b:rgba(6,9,9,.92); --key-line:rgba(0,0,0,.45); --key-label:#4E5B58;
  --wood-a:#3D2418; --wood-b:#20120C; --shade:rgba(5,4,3,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* ---------- TV: the second screen over AirPlay or a cable. The phone stays the controller; this is the stage. ---------- */
.tvbadge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 12px var(--f-body);letter-spacing:.02em;white-space:nowrap}
.tvbadge svg{width:15px;height:15px}
.tvbadge[hidden]{display:none}
body.tv{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);cursor:none}
body.tv > header, body.tv > main, body.tv > #sheet, body.tv > #toast, body.tv > #welcome, body.tv > #life{display:none !important}
#tv{position:fixed;inset:0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;row-gap:2.4vh;padding:4.4vh 5vw 4.8vh;
  background:radial-gradient(80% 70% at 8% -10%, rgba(229,149,59,.16), transparent 62%), radial-gradient(60% 60% at 105% 110%, rgba(125,182,213,.09), transparent 60%), var(--bg);transition:background .6s}
#tv.done{background:var(--burst)}
#tv.done .tvprompt, #tv.done .tvprompt small, #tv.done .tvtop, #tv.done .tvtop .brand, #tv.done .tvmeter span{color:var(--burst-ink)}
.tvtop{display:flex;align-items:center;gap:1.4vw;font-size:1.2vw;font-weight:600;color:var(--muted);min-height:2.4vw}
.tvtop .brand{display:flex;flex:none;align-items:center;gap:.7vw;margin:0;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.55vw;letter-spacing:-.01em}
#tvlabel:not(:empty)::before{content:'';display:inline-block;width:2px;height:1.3vw;border-radius:1px;background:var(--line);margin-right:1.4vw;vertical-align:-.15vw}
.tvtop .brand svg{width:2.1vw;height:2.1vw}
.tvtop .grow{flex:1}
.tvpill{display:inline-flex;align-items:center;gap:.6vw;padding:.55vh 1.1vw;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.tvpill i{display:inline-block;width:1.5vw;height:.9vw;border:2px solid var(--amber);border-radius:.3vw;background:rgba(229,165,91,.14)}
.tvpill[hidden]{display:none}
.tvprompt{font-family:var(--f-display);font-weight:800;font-size:4.4vw;line-height:1.02;letter-spacing:-.03em;max-width:86vw;min-height:4.5vw}
.tvprompt em{font-style:normal;color:var(--amber)}
.tvprompt small{display:block;margin-top:1.3vh;font-family:var(--f-body);font-weight:500;font-size:1.55vw;letter-spacing:0;color:var(--muted)}
.tvstage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.tvboard{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tvboard[hidden], .tvtun[hidden]{display:none}
body.tv #board{width:100%;height:100%;max-width:none;max-height:100%;filter:drop-shadow(0 2.2vh 3vh rgba(0,0,0,.45))}
.tvfoot{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:3vw;min-height:3vw}
.tvfb{font-weight:700;font-size:2vw;line-height:1.2}
.tvfb.good{color:var(--good)} .tvfb.bad{color:var(--bad)}
.tvmeter{display:grid;gap:.8vh;justify-items:end;min-width:24vw}
.tvmeter span{font-size:1.15vw;font-weight:600;color:var(--muted)}
.tvmeter i{display:block;width:24vw;height:.9vh;border-radius:1vh;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.tvmeter b{display:block;height:100%;border-radius:1vh;background:var(--amber);transition:width .4s}
.tvpiano{display:flex;align-items:center;justify-content:center;gap:2.4vw;height:15vh}
body.tv #piano{height:100%;width:auto;max-width:none;margin:0}
body.tv .pcap{display:block;width:13vw;font-size:.95vw}
body.tv .pcap b{font-size:2.8vw;margin-top:.4vh}
.tvtun{display:grid;grid-template-columns:1fr 1.3fr;align-items:center;gap:4vw;width:100%;height:100%}
.tvnote{font-family:var(--f-display);font-weight:800;font-size:15vw;line-height:.86;letter-spacing:-.045em;transition:color .2s}
.tvnote.ok{color:var(--good)}
.tvnote.wait{color:color-mix(in srgb,var(--ink) 30%,transparent)}
.tvcents{font-family:var(--f-mono);font-size:1.6vw;color:var(--muted);margin-top:2.6vh}
.tvstrs{display:flex;gap:.9vw;margin-top:3.4vh}
.tvstrs span{width:4.4vw;height:4.4vw;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 9%,transparent);font-weight:800;font-size:1.7vw;color:var(--muted);transition:background .2s,color .2s}
.tvstrs span.cur{background:var(--amber);color:#1C1612}
.tvgauge svg{width:100%;height:auto;max-height:58vh;max-width:none !important;display:block}
#tv .miclvl.wide{margin:3.4vh 0 0;width:24vw;height:1vh;border-radius:1vh}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- app bar and tabs ---------- */
.appbar-in{display:flex;align-items:center;gap:10px;padding-block:12px 4px;min-height:60px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.025em;margin-right:auto}
.brand svg{width:28px;height:28px;flex:none;border-radius:8px}
.brand i{font-style:normal;color:var(--amber)}
.actions{display:flex;gap:8px;align-items:center}
.iconbtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.iconbtn svg{width:19px;height:19px}
.streak{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 13px 0 10px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font:800 16px var(--f-display);cursor:pointer;font-variant-numeric:tabular-nums}
.streak svg{width:17px;height:17px;color:var(--amber)}
.streak.done{background:var(--good);border-color:var(--good);color:#fff}
.streak.done svg{color:#fff}
.tabbar{display:flex;gap:4px}
.tabbar button{border:0;background:none;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;padding:6px 0;letter-spacing:.01em}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button[aria-selected="true"] .fillme{fill:currentColor}
@media (max-width:899px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(1.4);backdrop-filter:blur(20px) saturate(1.4);border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar button{flex:1;max-width:110px}
  main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
}
@media (min-width:900px){
  .appbar-in{padding-block:18px 6px}
  .brand,.actions{flex:1}
  .actions{justify-content:flex-end}
  .tabbar{background:var(--chip);border-radius:15px;padding:4px}
  .tabbar button{flex-direction:row;gap:7px;font-size:14px;padding:8px 16px;border-radius:11px}
  .tabbar svg{width:18px;height:18px}
  .tabbar button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
}

/* ---------- page ---------- */
main{display:flex;flex-direction:column;gap:16px;padding-block:6px 56px}
.vtitle{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.035em;line-height:1.02;margin:6px 0 0}
#above{display:flex;flex-direction:column;gap:14px;min-width:0}
#above:empty,#panel:empty{display:none}
.pianobar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
#piano{display:block;width:100%;max-width:740px;margin:0 auto;height:auto}
.pcap{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:118px;flex:none;line-height:1.35;padding-left:4px}
.pcap b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:0;text-transform:none;font-weight:700}
@media (max-width:760px){.pcap{display:none}}
.boardcard{overflow:hidden}
#board{display:block;width:100%;height:auto;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#board.v{max-width:420px}
#board .hit{fill:transparent;cursor:pointer}
#board .hit:hover{fill:rgba(255,255,255,.07)}
#board text{font-family:var(--f-body);pointer-events:none}
#board .dl{font-weight:600;dominant-baseline:central;text-anchor:middle}
#board .num{font-family:var(--f-mono);font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
#board .num.k{fill:var(--ink);font-weight:600}
#board .sn{font-family:var(--f-mono);font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
#board .mute{fill:var(--muted);font-size:18px;text-anchor:middle;dominant-baseline:central;font-weight:500}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:.2}}

#panel{display:grid;gap:14px;align-items:start;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0;grid-column:span 12}
@media (min-width:900px){.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c6{grid-column:span 6}}
.lbl{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:10px 0 -2px}
.sechead h3{margin:0;font-family:var(--f-display);font-size:21px;letter-spacing:-.015em}
.sechead span{margin-left:auto;color:var(--muted);font-size:13px}

/* ---------- controls ---------- */
.btn{height:46px;padding:0 19px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn svg{width:15px;height:15px;flex:none}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.small{height:36px;padding:0 13px;font-size:14px;border-radius:11px}
.btn.wide{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.chip{min-height:34px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:550;cursor:pointer;line-height:1.25;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:color-mix(in srgb,var(--muted) 60%,var(--line))}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sq{border-radius:10px;min-width:42px;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-size:13.5px;font-weight:650;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.lg{width:100%;max-width:440px}
.seg.lg button{flex:1;padding:9px 12px;font-size:14.5px}
.switch{width:51px;height:31px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;flex:none;transition:background .2s;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* ---------- type ---------- */
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.03em}
.big small{font-size:22px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:8px}
.sub{color:var(--muted);font-size:14.5px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14.5px;margin:14px 0 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.empty{color:var(--muted);font-size:15px;max-width:34ch}
.hint{font-size:13px;color:var(--muted);line-height:1.45}
.prompt{font-family:var(--f-display);font-weight:750;font-size:26px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.prompt em{font-style:normal;color:var(--amber)}
.chordname{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;letter-spacing:-.025em}
.tips{display:grid;gap:10px}
.tip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;cursor:pointer}
.tip b{font-family:var(--f-display);font-size:16.5px;font-weight:700;display:block;margin-bottom:2px}
.tip span{color:var(--muted);font-size:13.5px}
.tip[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,var(--surface))}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border-left:2px solid var(--line);padding-left:10px}
.stat b{display:block;font-family:var(--f-display);font-size:25px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.pad.n7{grid-template-columns:repeat(7,1fr)}
.key{border:1px solid var(--line);background:var(--surface);border-radius:14px;height:54px;cursor:pointer;font-family:var(--f-display);font-weight:750;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0;box-shadow:0 1px 0 rgba(0,0,0,.04);transition:transform .08s ease}
.key:active{transform:scale(.96)}
.key small{font-size:12px;color:var(--muted);font-weight:600}

@media (max-width:699px){
  .big{font-size:52px}
  .chordname{font-size:44px}
  .prompt{font-size:23px}

  .dock{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}

}

/* ---------- learn home ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 22px 20px;color:var(--burst-ink);background:var(--burst);box-shadow:0 24px 46px -24px rgba(110,48,14,.7), inset 0 0 0 1px rgba(255,236,210,.14);isolation:isolate}

.hero .eyebrow{font:600 11px/1.3 var(--f-mono);letter-spacing:.11em;text-transform:uppercase;opacity:.85}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1.02;letter-spacing:-.03em;margin:8px 0 8px;text-wrap:balance;max-width:16ch}

.hero .meter{display:flex;align-items:center;gap:10px;margin-top:18px;font:500 12px var(--f-mono);opacity:.92}
.hero .meter i{flex:1;height:6px;border-radius:99px;background:rgba(255,240,220,.2);overflow:hidden;display:block}
.hero .meter i b{display:block;height:100%;background:#FFEFD6;border-radius:inherit}
.hero .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hbtn{height:48px;padding:0 20px;border-radius:15px;border:0;background:#FFF6EA;color:#3A190B;font-weight:750;font-size:15.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .08s ease}
.hbtn:active{transform:scale(.98)}
.hbtn svg{width:16px;height:16px}
.hbtn.ghost{background:rgba(255,246,234,.13);color:#FFF6EA;box-shadow:inset 0 0 0 1px rgba(255,246,234,.38)}
.today{display:flex;align-items:center;gap:15px;border-radius:20px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.today:hover{border-color:color-mix(in srgb,var(--muted) 50%,var(--line))}
.dial{width:58px;height:58px;flex:none;position:relative;display:grid;place-items:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial b{font:800 15px var(--f-display);font-variant-numeric:tabular-nums}
.today .tt{display:block;font-family:var(--f-display);font-weight:750;font-size:18px;letter-spacing:-.01em}
.today .td{display:block;margin-top:1px;color:var(--muted);font-size:13.5px;line-height:1.35}
.today .go{margin-left:auto;color:var(--accent);flex:none}
.homegrid{display:grid;gap:14px}
@media (min-width:900px){.homegrid{grid-template-columns:1.6fr 1fr;align-items:stretch}.homegrid .today{flex-direction:column;align-items:flex-start;justify-content:center}.homegrid .today .go{margin:6px 0 0}}
.phase{margin-top:10px}
.phase-h{display:flex;align-items:baseline;gap:10px;margin:18px 0 2px}
.phase-n{font:600 12px var(--f-mono);color:var(--amber);letter-spacing:.06em}
.phase-h h3{margin:0;font-family:var(--f-display);font-size:22px;letter-spacing:-.02em}
.phase-h .ct{margin-left:auto;font:500 12px var(--f-mono);color:var(--muted)}
.phase-tag{color:var(--muted);font-size:14px;margin:2px 0 8px;max-width:62ch}
.phase-bar{height:4px;border-radius:99px;background:var(--chip);overflow:hidden;margin:6px 0 6px}
.phase-bar b{display:block;height:100%;background:var(--good);border-radius:inherit}
.rail{position:relative;margin:0;padding:0}
.rail::before{content:"";position:absolute;left:21px;top:24px;bottom:24px;width:6px;border-radius:3px;background:linear-gradient(90deg,var(--wood-a),var(--wood-b) 55%,var(--wood-a))}
.srow{position:relative;display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;padding:9px 10px 9px 0;border-radius:16px;cursor:pointer}
.srow:hover{background:var(--bg2)}
.node{justify-self:center;width:20px;height:20px;border-radius:50%;background:var(--pearl);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.16), 0 0 0 3px var(--bg);display:grid;place-items:center;position:relative;z-index:1}
.node svg{width:12px;height:12px}
.srow.done .node{background:var(--good);color:#fff;box-shadow:0 0 0 3px var(--bg)}
.srow.mastered .node{background:var(--burst);color:#FFF6EA;box-shadow:0 0 0 3px var(--bg), 0 0 0 4.5px color-mix(in srgb,var(--amber) 55%,transparent)}
.srow.cur .node{background:var(--amber);box-shadow:0 0 0 3px var(--bg), 0 0 0 7px color-mix(in srgb,var(--amber) 30%,transparent);animation:halo 2s ease-in-out infinite}
@keyframes halo{50%{box-shadow:0 0 0 3px var(--bg), 0 0 0 10px color-mix(in srgb,var(--amber) 14%,transparent)}}
.srow b{display:block;font-weight:650;font-size:15.5px;line-height:1.3}
.srow small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.srow .chev{color:var(--muted);width:16px;height:16px}
.srow.cur b{color:var(--ink)}
.newtag{display:inline-block;font:700 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 6px;margin-right:6px}
.gapnote{font-size:13.5px;opacity:.9;margin:6px 0 0}
.scalerow{display:flex;flex-wrap:wrap;align-items:center;gap:5px 4px;font:800 20px/1.2 var(--f-display);letter-spacing:-.01em}
.scalerow i{font:600 10.5px var(--f-mono);font-style:normal;color:var(--muted);background:var(--chip);border-radius:6px;padding:2px 5px;letter-spacing:0}
.scalerow i.h{background:color-mix(in srgb,var(--amber) 28%,transparent);color:var(--ink)}
.kindtag{display:inline-block;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin-right:6px}
.footlinks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
/* stage page */
.stagehead{display:flex;flex-direction:column;gap:6px}
.backlink{align-self:flex-start;display:inline-flex;align-items:center;gap:3px;border:0;background:none;color:var(--accent);font-weight:650;font-size:15px;padding:4px 6px 4px 0;cursor:pointer}
.backlink svg{width:16px;height:16px}
.stagehead .eyebrow{font:600 11px var(--f-mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.stagehead h2{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.03;margin:0;text-wrap:balance}
.stagehead p{color:var(--muted);max-width:64ch;margin:2px 0 0;font-size:15.5px}
.passed{color:var(--good)}
.ctabar{position:sticky;bottom:16px;z-index:7;display:flex;gap:10px;align-items:center;padding:10px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow)}
.ctabar .btn{height:50px;font-size:16px}
.ctabar .ctasub{font-size:12.5px;color:var(--muted);padding:0 6px;line-height:1.3}

/* practice hub */
.pgrid{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.pcard{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.pcard .top{display:flex;align-items:center;gap:12px}
.pcard .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.pcard .ic svg{width:22px;height:22px}
.pcard h3{margin:0;font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.pcard p{margin:0;color:var(--muted);font-size:14px}
.pcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.hero.mini h2{font-size:28px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- settings sheet ---------- */
#sheet{position:fixed;inset:0;z-index:45;background:rgba(5,8,7,.42);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.sheetcard{background:var(--bg);width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -12px 40px rgba(0,0,0,.25);animation:sheetup .24s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetup{from{transform:translateY(40px);opacity:.4}}
@media (min-width:700px){#sheet{align-items:center}.sheetcard{border-radius:24px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin:4px 0 6px}
.sheethead h2{margin:0;font-family:var(--f-display);font-size:26px;letter-spacing:-.02em}
.glabel{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 4px 7px}
.sgroup{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sgroup.padded{padding:14px;display:flex;flex-direction:column;gap:12px}
.sline{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.sline:last-child{border-bottom:0}
.sline > div{flex:1;min-width:0}
.sline b{display:block;font-weight:600;font-size:15px}
.sline small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:1px}
button.sline{cursor:pointer;color:var(--accent);font-weight:600}
button.sline.danger{color:var(--bad)}
.fine{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}

/* ---------- welcome ---------- */
#welcome{position:fixed;inset:0;z-index:40;background:rgba(5,8,7,.5);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#welcome[hidden]{display:none}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:24px;max-width:460px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.3);max-height:calc(100dvh - 40px);overflow-y:auto}
.wtext ul.why{margin:12px 0 0;padding-left:18px;display:grid;gap:8px}
.wtext ul.why b{color:var(--ink)}
.wopts{display:grid;gap:9px}
.wopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:13px 15px;cursor:pointer}
.wopt:hover{border-color:var(--accent)}
.wopt b{display:block;font-family:var(--f-display);font-size:16.5px;letter-spacing:-.01em}
.wopt span{color:var(--muted);font-size:13.5px}
.wneck svg{width:100%;display:block}
.wart{margin:-24px -24px 18px;height:150px;background:var(--burst);position:relative;overflow:hidden;border-radius:26px 26px 0 0}
.wart svg{position:absolute;inset:0;width:100%;height:100%}
.wdots{display:flex;gap:6px;margin-bottom:14px}
.wdots span{width:22px;height:4px;border-radius:2px;background:var(--line)}
.wdots span.on{background:var(--accent)}

/* ---------- life-size practice ---------- */
#life{position:fixed;inset:0;z-index:30;background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#lifecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ltop,.lbot{position:absolute;left:0;right:0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);pointer-events:none}

.lztrack::before{content:'';position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.lztrack i{position:absolute;left:0;top:50%;width:100%;height:4px;margin-top:-2px;border-radius:2px;background:var(--accent)}
.lztrack b{position:absolute;left:100%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 5px rgba(0,0,0,.28);transition:transform .12s}
.lztrack.drag b, .lztrack:focus-visible b{transform:scale(1.15)}
#life.celebrate .lzoom{display:none}
/* whole-neck option: the normal fretboard between the panels; the canvas stays on top for confetti and the beat */
.lflat{position:absolute;left:0;right:0;top:130px;bottom:160px;display:none;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}

.miclvl{display:inline-block;width:30px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--muted) 22%,transparent);overflow:hidden;vertical-align:middle;margin-left:8px}
.miclvl i{display:block;height:100%;width:100%;background:var(--muted);transform-origin:left center;transform:scaleX(0);transition:transform .06s linear}
.miclvl.on i{background:var(--good)}
.miclvl.wide{display:block;width:min(240px,72%);height:8px;margin:12px auto 0;border-radius:4px}
@media (max-width:400px){.lbtn{padding:0 10px;font-size:13.5px}.lrow{gap:6px}}
.lpos{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:auto}
.lstat{font-size:12.5px;color:var(--muted);font-weight:600}
.lprompt{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.08;letter-spacing:-.02em;margin-top:6px}
.lprompt em{font-style:normal;color:var(--amber)}
.lprompt small{display:block;font-family:var(--f-body);font-weight:500;font-size:13.5px;color:var(--muted);margin-top:3px;letter-spacing:0}

.lmeter i{flex:1;height:6px;border-radius:99px;background:var(--chip);overflow:hidden;display:block}
.lmeter i b{display:block;height:100%;background:var(--good);transition:width .25s;border-radius:inherit}
#lpad .key{height:50px}
#lpad .tapkey{height:96px;width:100%;font-size:26px;letter-spacing:-.01em;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#lpad .tapkey:active{transform:scale(.97);filter:brightness(1.1)}
#life.celebrate .ltop{background:var(--burst);color:var(--burst-ink);border-bottom-color:transparent}

#life.celebrate .lprompt small,#life.celebrate .lpos,#life.celebrate .lstat,#life.celebrate .lmeter{color:rgba(255,246,234,.85)}
#life.celebrate .lmeter i{background:rgba(255,240,220,.25)}
#life.celebrate .lmeter i b{background:#FFEFD6}

.lfb{font-weight:650;font-size:14px;min-height:18px;line-height:1.3}
.lfb:empty{display:none}
.lfb.good{color:var(--good)} .lfb.bad{color:var(--bad)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 17px;border-radius:14px;font-size:14px;max-width:min(92vw,440px);box-shadow:0 8px 28px rgba(0,0,0,.28)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script>
(() => {
const $ = s => document.querySelector(s);

function parseName(n){ let a = 0; for (const ch of n.slice(1)){ if (ch === '♯') a++; if (ch === '♭') a--; } const L = n[0]; return { L, a, pc:(LETTER_PC[LETTERS.indexOf(L)] + a + 12) % 12 }; }
function spell(root, iv){
  const r = parseName(root), deg = parseInt(iv.replace(/[b#]/g,''), 10);
  const li = (LETTERS.indexOf(r.L) + deg - 1) % 7, tpc = (r.pc + IV[iv]) % 12;

  return LETTERS[li] + (a > 0 ? '♯'.repeat(a) : '♭'.repeat(-a));

function noteFill(pc){ return S.color ? `hsl(${(pc*30 + 8) % 360} 60% 74%)` : 'var(--pearl)'; }

/* ---------- music data ---------- */

  '7':{name:'Dominant 7th', sym:'7', f:['1','3','5','b7']},
  maj7:{name:'Major 7th', sym:'maj7', f:['1','3','5','7']},
  m7:{name:'Minor 7th', sym:'m7', f:['1','b3','5','b7']},
  sus2:{name:'Suspended 2nd', sym:'sus2', f:['1','2','5']},
  sus4:{name:'Suspended 4th', sym:'sus4', f:['1','4','5']},
  dim:{name:'Diminished', sym:'°', f:['1','b3','b5']},
  aug:{name:'Augmented', sym:'+', f:['1','3','#5']},
  m7b5:{name:'Half-diminished', sym:'m7♭5', f:['1','b3','b5','b7']},
  dim7:{name:'Diminished 7th', sym:'°7', f:['1','b3','b5','bb7']},
  mMaj7:{name:'Minor-major 7th', sym:'m(maj7)', f:['1','b3','5','7']},
  maj7s5:{name:'Augmented major 7th', sym:'maj7♯5', f:['1','3','#5','7']},
  '5':{name:'Power chord', sym:'5', f:['1','5']}
};
const CQ_MAIN = ['maj','min','7','maj7','m7','sus2','sus4','dim','aug','m7b5','dim7','5'];
// [shape name, root string, fret offsets low E→high e relative to root fret; null = muted]
const SHAPES = {
  maj:[['E',0,[0,2,2,1,0,0]],['A',1,[null,0,2,2,2,0]],['C',1,[null,0,-1,-3,-2,-3]],['G',0,[0,-1,-3,-3,-3,0]],['D',2,[null,null,0,2,3,2]]],
  min:[['E',0,[0,2,2,0,0,0]],['A',1,[null,0,2,2,1,0]],['D',2,[null,null,0,2,3,1]]],
  '7':[['E',0,[0,2,0,1,0,0]],['A',1,[null,0,2,0,2,0]],['C',1,[null,0,-1,0,-2,-3]],['D',2,[null,null,0,2,1,2]],['G',0,[0,-1,-3,-3,-3,-2]]],
  maj7:[['E',0,[0,2,1,1,0,0]],['A',1,[null,0,2,1,2,0]],['C',1,[null,0,-1,-3,-3,-3]],['D',2,[null,null,0,2,2,2]],['Jazz',0,[0,null,1,1,0,null]]],
  m7:[['E',0,[0,2,0,0,0,0]],['A',1,[null,0,2,0,1,0]],['D',2,[null,null,0,2,1,1]],['Jazz',0,[0,null,0,0,0,null]]],
  sus2:[['A',1,[null,0,2,2,0,0]],['D',2,[null,null,0,2,3,0]]],
  sus4:[['E',0,[0,2,2,2,0,0]],['A',1,[null,0,2,2,3,0]],['D',2,[null,null,0,2,3,3]]],
  dim:[['A',1,[null,0,1,2,1,null]],['D',2,[null,null,0,1,3,1]]],
  aug:[['E',0,[0,3,2,1,1,0]],['C',1,[null,0,-1,-2,-2,-3]]],
  m7b5:[['E',0,[0,null,0,0,-1,null]],['A',1,[null,0,1,0,1,null]]],
  dim7:[['E',0,[0,null,-1,0,-1,null]],['A',1,[null,0,1,2,1,2]]],
  mMaj7:[['E',0,[0,2,1,0,0,0]],['A',1,[null,0,2,1,1,0]]],
  maj7s5:[['C',1,[null,0,-1,-2,-3,-3]]],
  '5':[['E',0,[0,2,2,null,null,null]],['A',1,[null,0,2,2,null,null]]]
};
function genVoicings(r, q){
  const out = [], seen = new Set();
  for (const [shape, rs, offs] of (SHAPES[q] || [])){
    for (let b = 0; b <= FRETS; b++){
      if (pcOf(TUNING[rs] + b) !== r) continue;
      const fr = offs.map(o => o == null ? null : b + o);
      if (fr.some(x => x != null && (x < 0 || x > FRETS))) continue;
      const key = fr.join(','); if (seen.has(key)) continue; seen.add(key);
      const played = fr.filter(x => x != null), fretted = played.filter(x => x > 0);
      const lo = fretted.length ? Math.min(...fretted) : 0;
      out.push({ shape, frets:fr, lo, open: played.includes(0), rs });
    }
  }
  out.sort((a,b) => a.lo - b.lo || (b.open - a.open));
  return out;
}
const CHORD_ROOTS = { sharp:['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'], flat:['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'] };
const chordRoot = pc => CHORD_ROOTS[S.acc][pc];

const SCALES = {
  major:{name:'Major', iv:['1','2','3','4','5','6','7'], fam:'maj', parent:0},
  minor:{name:'Natural minor', iv:['1','2','b3','4','5','b6','b7'], fam:'min', parent:9},
  majpent:{name:'Major pentatonic', iv:['1','2','3','5','6'], fam:'maj'},
  minpent:{name:'Minor pentatonic', iv:['1','b3','4','5','b7'], fam:'min'},
  blues:{name:'Blues', iv:['1','b3','4','b5','5','b7'], fam:'min'},
  dorian:{name:'Dorian', iv:['1','2','b3','4','5','6','b7'], fam:'min', parent:2},
  phrygian:{name:'Phrygian', iv:['1','b2','b3','4','5','b6','b7'], fam:'min', parent:4},
  lydian:{name:'Lydian', iv:['1','2','3','#4','5','6','7'], fam:'maj', parent:5},
  mixolydian:{name:'Mixolydian', iv:['1','2','3','4','5','6','b7'], fam:'maj', parent:7},
  locrian:{name:'Locrian', iv:['1','b2','b3','4','b5','b6','b7'], fam:'min', parent:11},
  harmonic:{name:'Harmonic minor', iv:['1','2','b3','4','5','b6','7'], fam:'min'}
};
const KEY_ROOTS = { maj:['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'], min:['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'] };
const ROMAN = ['I','II','III','IV','V','VI','VII'];
const TRIAD_Q = {'4,7':'maj','3,7':'min','3,6':'dim','4,8':'aug'};
const SEV_Q = {'4,7,11':'maj7','4,7,10':'7','3,7,10':'m7','3,6,10':'m7b5','3,6,9':'dim7','3,7,11':'mMaj7','4,8,11':'maj7s5'};

/* ---------- audio: Karplus-Strong pluck ---------- */
let ac = null, master = null, unlocked = false, silentEl = null; const bufs = {};
function actx(){
  if (!ac){
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    try { ac = new C({ latencyHint:'interactive' }); } catch(e){ ac = new C(); }
    master = ac.createGain(); master.gain.value = 0.9;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6500;
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(lp); lp.connect(comp); comp.connect(ac.destination);
  }
  if (ac.state !== 'running') ac.resume().catch(() => {});
  return ac;
}
function silentWavUrl(){
  const sr = 8000, n = sr / 2, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf], { type:'audio/wav' }));
}
// Called from real taps/clicks/keys. iPhones mute Web Audio when the ringer switch is on silent;
// asking for a "playback" audio session (and running a silent <audio> loop on older iOS) lets notes play anyway.
// In the iPhone app the native side already runs a play-and-record session; asking WebKit for the same
// type means starting the microphone never changes the session (a change there left the mic silent
// until the app was sent to the background and back). In a browser we use playback until the mic is first used.
const IS_NATIVE = !!(window.Capacitor && (typeof window.Capacitor.isNativePlatform === 'function' ? window.Capacitor.isNativePlatform() : true));
// Pinching would zoom the whole page (and leave it stuck zoomed in the app); the neck has a size slider instead.
if (IS_NATIVE){ const vp = document.querySelector('meta[name=viewport]'); if (vp) vp.content = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'; document.documentElement.style.touchAction = 'manipulation'; }
['gesturestart','gesturechange'].forEach(ev => document.addEventListener(ev, e => { if (IS_NATIVE || (typeof Life !== 'undefined' && Life.open)) e.preventDefault(); }, { passive:false }));
function setSession(type){ try { if (navigator.audioSession && navigator.audioSession.type !== type) navigator.audioSession.type = type; } catch(e){} }
function wantSession(){ return IS_NATIVE || (typeof Mic !== 'undefined' && Mic.used) ? 'play-and-record' : 'playback'; }
function unlockAudio(){
  if (!S.sound) return;
  setSession(wantSession());
  const c = actx(); if (!c) return;
  loadSamples();
  if (!unlocked){
    unlocked = true;
    try { const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0); } catch(e){}
    try { silentEl = new Audio(silentWavUrl()); silentEl.loop = true; silentEl.setAttribute('playsinline',''); silentEl.play().catch(() => {}); } catch(e){}
  }
}
['touchend','click','keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture:true, passive:true }));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ if (ac && ac.state !== 'running') ac.resume().catch(() => {}); if (typeof Mic !== 'undefined') Mic.wake(); } });
function pluckBuf(m){
  if (bufs[m]) return bufs[m];
  const sr = ac.sampleRate, N = Math.max(2, Math.round(sr / hz(m))), len = Math.floor(sr * 2.2);
  const b = ac.createBuffer(1, len, sr), d = b.getChannelData(0), ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;      // bright pick: full noise burst
  let mean = 0; for (let i = 0; i < N; i++) mean += ring[i] / N; for (let i = 0; i < N; i++) ring[i] -= mean;
  const loss = 0.9962 + 0.003 * Math.min(1, (m - 40) / 40);
  let p = 0;
  for (let i = 0; i < len; i++){
    const cur = ring[p], nx = ring[(p + 1) % N];
    d[i] = cur; ring[p] = (cur * 0.55 + nx * 0.45) * loss; p = (p + 1) % N;
  }
  const fade = Math.floor(sr * 0.08); for (let i = 0; i < fade; i++) d[len - 1 - i] *= i / fade;
  return (bufs[m] = b);
}
// Recorded acoustic guitar samples (tonejs-instruments, public-domain sources), one every 3 semitones, pitch-shifted to fill the gaps.
const SAMPLE_NOTES = {40:'E2',43:'G2',46:'As2',49:'Cs3',52:'E3',55:'G3',58:'As3',61:'Cs4',64:'E4',67:'G4',70:'As4',74:'D5'};
const samples = {}; let samplesAsked = false;
function loadSamples(){
  if (samplesAsked || !ac) return; samplesAsked = true;
  for (const [m, n] of Object.entries(SAMPLE_NOTES))
    fetch('samples/' + n + '.mp3').then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => ac.decodeAudioData(b, res, rej))).then(buf => { samples[m] = buf; }).catch(() => {});
}
function nearestSample(m){ let best = null, bd = 99; for (const k in samples){ const d = Math.abs(m - k); if (d < bd){ bd = d; best = +k; } } return bd <= 6 ? best : null; }
let warned = false;
function play(m, when = 0, vel = 1, opts = {}){
  if (!S.sound || !actx()) return null;
  loadSamples();
  const src = ac.createBufferSource(), k = nearestSample(m);

  },
  cell(s, f){ const e = S.explore; e.tip = null; e.sel = {s, f}; play(midiAt(s,f)); save(); this.render(); },
  act(a, v){
    const e = S.explore;
    if (a === 'labels') S.labels = v;
    if (a === 'octaves') e.octaves = !e.octaves;
    if (a === 'tip') e.tip = e.tip === +v ? null : +v;

};

const Drill = Practice;

/* ================= CHORDS ================= */
const Chords = {
  quiz:null, score:{n:0, ok:0, streak:0},
  name(r, q){ return chordRoot(r) + CQ[q].sym; },
  voicingMarks(vc, r, q, showText){
    const M = [], c = S.chords, root = chordRoot(r);
    const played = vc.frets.map((f, s) => f == null ? null : {s, f}).filter(Boolean);
    const fretted = played.filter(p => p.f > 0), lo = fretted.length ? Math.min(...fretted.map(p => p.f)) : 0;
    if (lo > 0 && played.every(p => p.f >= lo)){ const at = played.filter(p => p.f === lo); if (at.length >= 2) M.push({kind:'barre', f:lo, s:at[0].s, s2:at[at.length - 1].s}); }
    for (let s = 0; s < 6; s++){
      const f = vc.frets[s];
      if (f == null){ M.push({s, f:0, kind:'mute'}); continue; }
      const m = midiAt(s,f), pc = pcOf(m), iv = CQ[q].f.find(x => (r + IV[x]) % 12 === pc);
      const text = !showText ? '' : c.labels === 'int' ? ivDisp(iv) : spell(root, iv);
      M.push({s, f, pc, text, kind:'dot', root: showText && pc === r, fill: showText ? undefined : 'var(--pearl)'});
    }

  },
  midis(vc){ return vc.frets.map((f, s) => f == null ? null : midiAt(s,f)).filter(x => x != null); },
  render(){ this.renderStudy(); },

    if (c.map) for (const {s,f} of cellsIn([0,1,2,3,4,5], 0, FRETS)){

      if (iv && !(vc && vc.frets[s] === f)) M.push({s, f, pc, kind:'ghost', root: pc === r, text: c.labels === 'int' ? ivDisp(iv) : spell(root, iv)});
    }

    renderPiano(vc ? hlNotes(this.midis(vc)) : new Map(), this.name(r, q));
    const posLabel = v => v.open && v.lo <= 4 ? 'Open position' : `${v.shape === 'Jazz' ? 'Jazz voicing' : v.shape + ' shape'} · fret ${v.lo}`;
    $('#panel').innerHTML = `
      <div class="card c5 stack">

          <button class="btn ghost" data-act="vnext" aria-label="Next voicing" ${vs.length > 1 ? '' : 'disabled'}>›</button>

        <div><p class="lbl">Quality</p><div class="row">${CQ_MAIN.map(k => chip('q', k, k === 'maj' ? 'Major' : k === 'min' ? 'Minor' : CQ[k].sym, k === q)).join('')}</div></div>

  },
  capoCard(){

          <table class="ntab"><thead><tr><th>Shapes you play</th><th>Sounds in</th></tr></thead><tbody>${SHP.map(sh => `<tr><td><b>${chordRoot(sh)}</b> shapes</td><td>${chordRoot((sh + capo) % 12)}</td></tr>`).join('')}</tbody></table></div>

          <p style="margin:0">${opts.map(o => o.fret ? `Play <b>${chordRoot(o.sh)}</b> shapes with the capo on fret <b>${o.fret}</b>` : `Play <b>${chordRoot(o.sh)}</b> shapes, no capo`).join('<br>')}</p></div>

      r = rand(12); q = pick(c.quizQ); vs = genVoicings(r, q).filter(v => v.lo <= 10);

  renderQuiz(){

        <div class="opts">${z.opts.map((o, i) => { const [rr, qq] = o.split('|'); let cls = ''; if (done){ if (o === z.answer) cls = 'good'; else if (o === z.picked) cls = 'bad'; }
          return `<button class="key ${cls}" data-act="pick" data-v="${o}">${esc(this.name(+rr, qq))}<small>${i + 1}</small></button>`; }).join('')}</div>
        <div class="row"><button class="btn ghost" data-act="strum">Strum again</button><button class="btn" data-act="nextq" ${done ? '' : 'disabled'}>Next chord</button></div>
        <div class="stats"><div class="stat"><b>${sc.streak}</b><span>Streak</span></div><div class="stat"><b>${stats.chordBest || 0}</b><span>Best</span></div><div class="stat"><b>${sc.n ? Math.round(100 * sc.ok / sc.n) + '%' : '—'}</b><span>Accuracy</span></div><div class="stat"><b>${sc.n}</b><span>Answered</span></div></div>
      </div>
      <div class="card c5 stack">
        <div><p class="lbl">Chord types in the quiz</p><div class="row">${CQ_MAIN.map(k => chip('qq', k, k === 'maj' ? 'Major' : k === 'min' ? 'Minor' : CQ[k].sym, c.quizQ.includes(k))).join('')}</div></div>
        <p class="hint">Read the shape: find the root, usually on the lowest played string, then check whether the third is major or minor. Keys 1–4 pick an answer; Enter moves on.</p>
      </div>`;
  },
  cell(s, f){
    const c = S.chords;
    if (c.mode === 'quiz' && this.quiz){ const fr = this.quiz.vc.frets[s]; play(fr == null ? midiAt(s,f) : midiAt(s, fr)); return; }
    play(midiAt(s,f));
  },
  act(a, v){
    const c = S.chords;
    if (a === 'mode'){ c.mode = v; if (v === 'quiz') this.quiz = null; }
    if (a === 'root'){ c.root = +v; c.v = 0; }
    if (a === 'q'){ c.q = v; c.v = 0; }
    if (a === 'labels') c.labels = v;
    if (a === 'map') c.map = !c.map;
    if (a === 'capo') c.capo = +v;
    if (a === 'capokey') c.capoKey = +v;
    const n = genVoicings(c.root, c.q).length || 1;
    if (a === 'vprev') c.v = (c.v - 1 + n) % n;
    if (a === 'vnext') c.v = (c.v + 1) % n;
    if (a === 'strum'){
      const vc = c.mode === 'quiz' ? this.quiz && this.quiz.vc : genVoicings(c.root, c.q)[c.v];
      if (vc) strum(this.midis(vc)); return;
    }
    if (a === 'qq'){ if (c.quizQ.includes(v)){ if (c.quizQ.length > 1) c.quizQ = c.quizQ.filter(x => x !== v); } else c.quizQ.push(v); this.quiz = null; }
    if (a === 'pick' && this.quiz && this.quiz.picked == null){
      this.quiz.picked = v; const ok = v === this.quiz.answer, sc = this.score;
      sc.n++; if (ok){ sc.ok++; sc.streak++; if (sc.streak > (stats.chordBest || 0)){ stats.chordBest = sc.streak; saveStats(); } } else sc.streak = 0;
      strum(this.midis(this.quiz.vc)); haptic(ok ? 'success' : 'error');
    }
    if (a === 'nextq') this.quiz = null;
    if (['root','q','vprev','vnext'].includes(a) && c.mode === 'study'){ const vc = genVoicings(c.root, c.q)[c.v]; if (vc) strum(this.midis(vc)); }
    save(); this.render();
  },
  key(e){
    if (S.chords.mode !== 'quiz' || !this.quiz) return;
    if (/^[1-4]$/.test(e.key)){ const o = this.quiz.opts[+e.key - 1]; if (o){ e.preventDefault(); this.act('pick', o); } }
    if (e.key === 'Enter' && this.quiz.picked != null){ e.preventDefault(); this.act('nextq'); }
  }
};

/* ================= SCALES & KEYS ================= */
const Scales = {
  rootName(){ const sc = SCALES[S.scales.scale]; return KEY_ROOTS[sc.fam][S.scales.root]; },
  spelled(){ const rn = this.rootName(); return SCALES[S.scales.scale].iv.map(iv => spell(rn, iv)); },
  diatonic(){
    const sc = SCALES[S.scales.scale]; if (sc.iv.length !== 7) return null;
    const semis = sc.iv.map(iv => IV[iv]), names = this.spelled();
    return semis.map((st, i) => {
      const rel = k => (semis[(i + k) % 7] - st + 12) % 12;
      const key3 = rel(2) + ',' + rel(4), key7 = key3 + ',' + rel(6);

  cof(){
    const z = S.scales, sc = SCALES[z.scale], cx = 150, cy = 150;

    const wedge = (i, r1, r2) => { const a1 = (i * 30 - 105) * Math.PI / 180, a2 = (i * 30 - 75) * Math.PI / 180;

      return `M${p(r2,a1)} A${r2} ${r2} 0 0 1 ${p(r2,a2)} L${p(r1,a2)} A${r1} ${r1} 0 0 0 ${p(r1,a1)}Z`; };

      const pc = (i * 7) % 12, mpc = (pc + 9) % 12;

      const fill = d === 0 ? 'var(--accent)' : d === 1 ? 'color-mix(in srgb,var(--accent) 30%,var(--surface))' : 'var(--chip)';
      const ink = d === 0 ? 'var(--accent-ink)' : 'var(--ink)';
      const a = (i * 30 - 90) * Math.PI / 180;
      h += `<path class="w" d="${wedge(i, 96, 146)}" style="fill:${fill}" data-act="cof" data-v="${pc}|major"><title>${MAJ[i]} major</title></path>`;
      h += `<path class="w" d="${wedge(i, 52, 94)}" style="fill:${fill};opacity:.82" data-act="cof" data-v="${mpc}|minor"><title>${MIN[i]}</title></path>`;
      h += `<text x="${cx + 121 * Math.cos(a)}" y="${cy + 121 * Math.sin(a)}" style="font-size:16px;fill:${ink}">${MAJ[i]}</text>`;
      h += `<text x="${cx + 73 * Math.cos(a)}" y="${cy + 73 * Math.sin(a)}" style="font-size:11.5px;fill:${ink}">${MIN[i]}</text>`;
    }
    const sharpsFlats = i => i === 0 ? '' : i <= 6 ? i + '♯' : (12 - i) + '♭';
    const pi = MAJ.findIndex((_, j) => (j * 7) % 12 === parent);

    return h;
  },
  cell(s, f){ play(midiAt(s,f)); },
  act(a, v){
    const z = S.scales;

    if (a === 'scale'){ z.scale = v; z.chordSel = null; }

  boom(r, q){

  cell(s, f){

      if (pc === want){
        this.q.hits = (this.q.hits || []).concat([{s, f}]); this.flash = null;

        this.right(true, { t: st.alt ? `Root ${chordRoot(this.q.r)}, then ${nn(pc)}. Boom-chuck.` : `${nn(pc)} is the root of ${chordRoot(this.q.r)}.` });

    if (a === 'lgo'){ S.learn.id = v; S.learn.phase = 'study'; S.learn.sel = null; this.detail = true; this.streak = 0; this.reset(); save(); this.render(); window.scrollTo(0, 0); return; }

      if (st.kind !== 'ear' && (S.learn.view !== 'classic' || KINDS[st.kind])){ S.learn.phase = 'study'; save(); this.render(); Life.start(st.daily ? { type:'daily' } : { type:'learn', st }); return; }
      S.learn.phase = 'practice'; this.streak = 0; this.reset(); save(); this.render(); return;
    }
    if (a === 'lphase'){ S.learn.phase = v; this.streak = 0; this.reset(); }
    if (a === 'lnext'){ const n = LEARN[this.idx() + 1]; if (n){ S.learn.id = n.id; S.learn.phase = 'study'; S.learn.sel = null; } this.streak = 0; this.reset(); }
    if (a === 'lagain'){ if (st.daily){ DAILY.goal += 10; } else this.streak = 0; this.reset(); }
    if (a === 'lwalk'){ save(); Life.start({ type:'learn', st, walk:true }); return; }
    if (a === 'lhear' && st.walk){ arp(Pos.notes(st).map(n => n.m), .24); return; }
    if (a === 'lhear'){ const ms = [...new Set(this.pool(st).map(c => midiAt(c.s,c.f)))].sort((x,y) => x - y).filter(m => !st.from || m >= st.from); arp(ms.slice(0, 16), st.from ? 0.26 : 0.32); return; }

    if (a === 'lnum'){ S.learn.sel = v; const sel = this.studySel(st); strum(Chords.midis(openVoicing(sel.r, sel.q))); }
    if (a === 'lstrum'){ const sel = this.studySel(st); strum(Chords.midis(openVoicing(sel.r, sel.q))); return; }

// YIN pitch detector (de Cheveigné & Kawahara 2002) over a 2048-sample window; returns Hz or -1.
function detectPitch(b, sr, gate){

    run += sum; d[tau] = run ? sum * tau / run : 1;
  }

  for (let t = Math.max(2, minLag); t < maxLag; t++){
    if (d[t] < 0.18){ while (t + 1 < maxLag && d[t + 1] < d[t]) t++; tau = t; break; }
    if (best < 0 || d[t] < d[best]) best = t;
  }

  if (tau < 0 && best > 0 && d[best] < 0.3 && d[best] <= d[best - 1] && d[best] <= d[best + 1]) tau = best;

  },
  miniNeck(s, f){
    const W = 300, H = 74, x0 = 26, frets = Math.max(5, f + 1), fw = (W - x0 - 6) / frets, y = i => 10 + (5 - i) * 11;
    let h = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect x="${x0}" y="5" width="${W - x0 - 6}" height="64" rx="3" style="fill:var(--wood-b)"/>`;
    for (let n = 1; n <= frets; n++) h += `<line x1="${x0 + n * fw}" x2="${x0 + n * fw}" y1="5" y2="69" style="stroke:var(--fretwire);stroke-width:1.6"/>`;
    h += `<rect x="${x0 - 3}" y="5" width="3" height="64" style="fill:var(--bone)"/>`;
    for (let i = 0; i < 6; i++) h += `<line x1="${x0}" x2="${W - 6}" y1="${y(i)}" y2="${y(i)}" style="stroke:${i < 4 ? 'var(--wound)' : 'var(--string)'};stroke-width:${1.8 - i * .2}"/><text x="6" y="${y(i) + 3.5}" style="font:600 9px var(--f-mono);fill:var(--muted);text-anchor:middle">${SNAME[i]}</text>`;
    const cx = f ? x0 + (f - .5) * fw : x0 - 4;
    h += `<circle cx="${cx}" cy="${y(s)}" r="6.5" style="fill:var(--amber);stroke:#fff;stroke-width:1.5"/>`;
    if (f) h += `<text x="${cx}" y="${H - 1}" style="font:600 8px var(--f-mono);fill:var(--muted);text-anchor:middle">${f}</text>`;
    return h + '</svg>';
  },
  answer(v){
    const z = this.quiz, q = z.qs[z.i], c = pcOf(midiAt(q.s, q.f)), ok = +v === c;
    if (ok){ z.right++; z.fb = { cls:'good', t:'Yes' }; } else { z.miss.add(q.si); z.fb = { cls:'bad', t: +v < 0 ? `It's ${both(c)}` : `It's ${both(c)}` }; }
    if (+v >= 0) play(midiAt(q.s, q.f));
    haptic(ok ? 'success' : 'error');
    z.i++; this.draw();
  },
  placeAt(){
    const z = this.quiz; let first = PLACE.findIndex((_, si) => z.miss.has(si));
    return first;
  },
  drawResult(){
    const z = this.quiz, first = this.placeAt(), body = $('#wbody'); $('#wskip').hidden = true;
    const knownP = first < 0 ? PLACE : PLACE.slice(0, first), known = knownP.map(x => x.name);
    this.marks = knownP.flatMap(p => p.stages);
    const st = LEARN.find(x => !learnProg.done[x.id] && !this.marks.includes(x.id)) || LEARN[0], startId = st.id;
    body.innerHTML = `<p class="lbl">${z.right} of ${z.qs.length} right</p>
      <h2 id="wtitle" class="prompt" style="font-size:26px;margin:0 0 8px">Start at stage ${LEARN.indexOf(st) + 1}: <em>${st.t}</em></h2>
      <p class="sub" style="font-size:15px;margin:0 0 14px">${known.length ? `You know ${known.join(', ')}, so those stages are marked as passed. You can still open any of them.` : 'The open strings are the place to start. Everything else is counted up from them.'}</p>
      <div class="row"><button class="btn" data-w="go" data-v="${startId}">Start here</button><button class="btn ghost" data-w="go" data-v="${LEARN[0].id}">Start from stage 1</button></div>`;
  },
  finish(startId, marks){
    if (marks && marks.length){ for (const id of marks) if (LEARN_ALL.some(x => x.id === id)) Review.passed(id); }
    this.close(); S.learn.id = startId; S.learn.phase = 'study'; Learn.detail = false; save(); go('learn'); window.scrollTo(0, 0);
  },
  close(){ $('#welcome').hidden = true; store.set('fretwise.welcomed2', true); store.set('fretwise.welcomed', true); }
};
$('#wnext').addEventListener('click', () => { if (Welcome.i < WELCOME.length - 1){ Welcome.i++; Welcome.draw(); } });
$('#wskip').addEventListener('click', () => { if (Welcome.quiz){ Welcome.quiz.i = Welcome.quiz.qs.length; Welcome.draw(); return; } Welcome.close(); });
$('#wbody').addEventListener('click', e => {
  const b = e.target.closest('[data-w]'); if (!b) return; const w = b.dataset.w; actx();
  if (w === 'piano'){ S.profile.piano = b.dataset.v; save(); rebuildPath(); Welcome.i++; Welcome.draw(); return; }
  if (w === 'new') Welcome.finish(LEARN[0].id, null);
  if (w === 'rhythm') Welcome.finish('gcd', NOTE_STAGES.concat(['home']));
  if (w === 'quiz') Welcome.startQuiz();
  if (w === 'ans') Welcome.answer(b.dataset.v);
  if (w === 'go') Welcome.finish(b.dataset.v, b.dataset.v === LEARN[0].id ? null : Welcome.marks);
});

/* ---------- explore tab: notes, chords, scales ---------- */
const ExploreTab = {
  sub(){ return { notes:Explore, chords:Chords, scales:Scales }[S.exmode] || Explore; },
  render(){
    layout({ title:'Explore', piano:true, board:true });
    $('#above').innerHTML = seg('exmode', S.exmode || 'notes', [['notes','Notes'],['chords','Chords'],['scales','Scales & keys']], 'lg');
    this.sub().render();
  },
  act(a, v){
    if (a === 'exmode'){ const m = this.sub(); m.leave && m.leave(); S.exmode = v; save(); this.render(); return; }
    if (a === 'lfree'){ Life.start({ type:'free' }); return; }
    this.sub().act(a, v);
  },
  cell(s, f){ const m = this.sub(); m.cell && m.cell(s, f); },
  input(e){ const m = this.sub(); m.input && m.input(e); },
  key(e){ const m = this.sub(); m.key && m.key(e); },
  leave(){ const m = this.sub(); m.leave && m.leave(); }
};

/* ---------- settings sheet ---------- */
const Settings = {
  confirmReset:false,
  open(){ this.confirmReset = false; $('#sheet').hidden = false; this.render(); },
  close(){ $('#sheet').hidden = true; renderStreak(); MODES[tab].render(); },
  sw(key, on){ return `<button class="switch" role="switch" aria-checked="${!!on}" data-s="${key}" aria-label="${key}"></button>`; },
  render(){
    const pianoOn = S.profile.piano === 'yes' || S.profile.piano === 'some';
    $('#sheetbody').innerHTML = `
      <p class="glabel">Sound</p>
      <div class="sgroup"><div class="sline"><div><b>Sound</b><small>Recorded acoustic guitar. Plays even with the silent switch on.</small></div>${this.sw('sound', S.sound)}</div></div>
      <p class="glabel">Notes</p>
      <div class="sgroup">
        <div class="sline"><div><b>Sharps or flats</b><small>How the in-between notes are named</small></div>${seg('acc', S.acc, [['sharp','♯'],['flat','♭']])}</div>
        <div class="sline"><div><b>Note colors</b><small>Each note keeps its own color on the neck and the keys</small></div>${this.sw('color', S.color)}</div>
      </div>
      <p class="glabel">About you</p>
      <div class="sgroup"><div class="sline"><div><b>Piano background</b><small>Adds a keyboard-to-neck lesson, and speeds up theory stages if theory is familiar</small></div><select id="pianolvl" aria-label="Piano background" style="max-width:46%;font:inherit;font-size:14px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)">${PIANO_LEVELS.map(([v, b]) => `<option value="${v}"${(S.profile.piano || 'no') === v ? ' selected' : ''}>${b}</option>`).join('')}</select></div></div>
      <p class="glabel">Life-size neck</p>
      <div class="sgroup padded">${calCard()}</div>
      <p class="glabel">Progress</p>
      <div class="sgroup">
        <button class="sline" data-s="place">Find my starting stage</button>
        <button class="sline danger" data-s="reset">${this.confirmReset ? 'Tap again to erase every stage, streak and note history' : 'Reset all progress'}</button>
      </div>
      <p class="fine">Fretwise · <a href="support.html">Help</a> · <a href="privacy.html">Privacy</a></p>`;
  },
  act(k, v){
    if (k === 'sound'){ S.sound = !S.sound; if (S.sound){ unlockAudio(); play(55); } else if (silentEl) silentEl.pause(); }
    if (k === 'acc') S.acc = v;
    if (k === 'color') S.color = !S.color;
    if (k === 'piano'){ S.profile.piano = (S.profile.piano === 'yes' || S.profile.piano === 'some') ? 'no' : 'yes'; rebuildPath(); }
    if (k === 'place'){ $('#sheet').hidden = true; Welcome.show(WELCOME.findIndex(w => w.place)); return; }
    if (k === 'reset'){
      if (!this.confirmReset){ this.confirmReset = true; this.render(); return; }
      learnProg.done = {}; store.set('fretwise.learn', learnProg);
      for (const d in days) delete days[d]; store.set('fretwise.days', days);
      stats.c = {}; stats.best = 0; saveStats();
      S.learn.id = 'open'; S.learn.phase = 'study'; Learn.detail = false; this.confirmReset = false; save();
      toast('Progress reset. Back to stage 1.');
    }
    if (k !== 'reset') this.confirmReset = false;
    save(); this.render();
  }
};
$('#gset').addEventListener('click', () => Settings.open());
$('#sheetdone').addEventListener('click', () => Settings.close());
$('#sheet').addEventListener('click', e => {
  if (e.target.id === 'sheet'){ Settings.close(); return; }
  const b = e.target.closest('[data-s],[data-act]'); if (!b) return;
  if (b.dataset.act === 'lcalreset'){ S.life.k = null; save(); Settings.render(); return; }
  if (b.dataset.act === 'acc'){ Settings.act('acc', b.dataset.v); return; }
  if (b.dataset.s) Settings.act(b.dataset.s, b.dataset.v);
});
$('#sheet').addEventListener('input', e => calInput(e));
$('#sheet').addEventListener('change', e => { if (e.target.id === 'pianolvl'){ S.profile.piano = e.target.value; save(); rebuildPath(); Settings.render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) Settings.close(); });

/* ---------- shell ---------- */
/* ---------- second screen (AirPlay or a cable) ----------
   In the iPhone app, a TV gets its own window running this page in display mode (window.__FW_DISPLAY).
   The phone stays the controller and sends a small snapshot of what's on screen about eight times a
   second; the native side passes it to the TV page, which draws the whole neck, piano and prompt big. */
const TV = {
  on:false, timer:0, last:'', snd:[],
  link(){ const w = window.webkit; return w && w.messageHandlers && w.messageHandlers.fwDisplay; },
  hello(){ const h = this.link(); if (h) try { h.postMessage('hello'); } catch(e){} },
  set(on){
    this.on = !!on; clearInterval(this.timer); this.timer = 0; this.last = '';
    if (this.on){ this.timer = setInterval(() => this.push(), 120); this.push(); }
    const b = $('#tvbadge'); if (b) b.hidden = !this.on;
  },
  sound(m, t){ if (!this.on) return; this.snd.push({ m, t }); if (this.snd.length > 24) this.snd.shift(); },
  push(){
    const h = this.link(); if (!h) return;
    let js; try { js = JSON.stringify(this.state()); } catch(e){ return; }
    if (js === this.last) return; this.last = js;
    try { h.postMessage(js); } catch(e){}
  },
  // notes the app is playing plus the note the microphone hears, for the TV piano
  sounding(){
    const now = performance.now(); this.snd = this.snd.filter(x => now - x.t < 1600);
    const ms = this.snd.filter(x => x.t <= now + 30).map(x => x.m);
    if (Mic.on && Mic.lastF > 0) ms.push(Math.round(f2m(Mic.lastF)));
    const u = [...new Set(ms)].filter(m => m >= LO && m <= HI), top = u[u.length - 1];
    return { keys:u.map(m => [m, noteFill(pcOf(m)), nn(pcOf(m)), 0]), cap:top != null ? nn(pcOf(top)) + octOf(top) : '—' };
  },
  state(){
    const base = { v:1, acc:S.acc, color:!!S.color, streak:dayStreak() };
    if (Life.open && Life.cv){
      const fb = $('#lfb'), q = Life.q;
      return Object.assign(base, { scene:'life', label:$('#lstat').textContent, prompt:$('#lprompt').innerHTML,
        meter:$('#lmeter').hidden ? '' : $('#lmeter').innerHTML, fb:{ cls:fb.className, t:fb.textContent },
        done:!!(q && q.mode === 'done'), marks:Life.tvMarks(), win:Life.flat ? null : Life.tvWindow(), piano:this.sounding() });
    }
    if (tab === 'tune') return Object.assign(base, { scene:'tuner', tuner:Tuner.tvState(), piano:this.sounding() });
    const title = $('#vtitle').hidden ? '' : $('#vtitle').textContent;
    if (!$('#boardcard').hidden && drawMarks.last){
      const rp = renderPiano.last, snd = this.sounding();
      const piano = snd.keys.length || !rp || $('#pianobar').hidden ? snd : { keys:[...rp.hl].map(([m, o]) => [m, o.fill, o.label || '', o.faint ? 1 : 0]), cap:rp.caption };
      return Object.assign(base, { scene:'board', title, marks:drawMarks.last, piano });
    }
    const nx = Learn.nextStage();
    return Object.assign(base, { scene:'home', title, next:nx ? (LEARN.indexOf(nx) + 1) + '. ' + nx.t : '', today:Math.min(days[todayKey()] || 0, DAILY_GOAL), goal:DAILY_GOAL, piano:this.sounding() });
  }
};
window.__fwScreen = on => TV.set(on);

// The TV page: built once, then redrawn from each snapshot the phone sends.
const TVView = {
  mk:'', pk:'', scene:'',
  boot(){
    document.documentElement.dataset.theme = 'dark';
    document.body.classList.add('tv');
    const el = document.createElement('div'); el.id = 'tv';
    el.innerHTML = `
      <div class="tvtop"><span class="brand" id="tvbrand"></span><span id="tvlabel"></span><span class="grow"></span>
        <span class="tvpill" id="tvlegend" hidden><i></i>Your phone’s view</span><span class="tvpill" id="tvstreak" hidden></span></div>
      <div class="tvprompt" id="tvprompt"></div>
      <div class="tvstage">
        <div class="tvboard" id="tvboard"></div>
        <div class="tvtun" id="tvtun" hidden>
          <div><div class="tvnote wait" id="tvnote">♪</div><div class="tvcents" id="tvcents"></div><div class="tvstrs" id="tvstrs"></div><div class="miclvl wide" id="tvlvl"><i></i></div></div>
          <div class="tvgauge">${gaugeSVG('tvneedle')}</div>
        </div>
      </div>
      <div class="tvfoot"><div class="tvfb" id="tvfb"></div><div class="tvmeter" id="tvmeter"></div></div>
      <div class="tvpiano" id="tvpiano"></div>`;
    document.body.appendChild(el);
    const br = document.querySelector('.appbar .brand'); if (br) $('#tvbrand').innerHTML = br.innerHTML.replace(/id="lg"/g, 'id="tvlg"').replace(/url\(#lg\)/g, 'url(#tvlg)');
    $('#tvboard').appendChild(board); $('#tvpiano').append($('#pcap'), piano);
    G = null; ensureBoard();
    window.addEventListener('resize', () => { if (ensureBoard()){ this.mk = ''; if (this.st) this.apply(this.st); } });
    window.__fwDisplay = st => { try { this.apply(typeof st === 'string' ? JSON.parse(st) : st); } catch(e){} };
    this.apply({ scene:'home', piano:{ keys:[], cap:'—' } });
    const w = window.webkit, h = w && w.messageHandlers && w.messageHandlers.fwTV; if (h) try { h.postMessage('ready'); } catch(e){}
  },
  apply(st){
    this.st = st;
    if (st.acc) S.acc = st.acc; if (st.color != null) S.color = st.color;
    const sc = st.scene || 'home', tv = $('#tv');
    tv.dataset.scene = sc; tv.classList.toggle('done', !!st.done);
    $('#tvlabel').textContent = sc === 'life' ? st.label || '' : sc === 'home' ? st.title || '' : '';
    const sk = $('#tvstreak'); sk.hidden = !st.streak; sk.textContent = st.streak ? `${st.streak}-day streak` : '';
    $('#tvlegend').hidden = sc !== 'life' || !st.win;
    let pr = '';
    if (sc === 'life') pr = st.prompt || '';
    else if (sc === 'board') pr = esc(st.title || '');
    else if (sc === 'tuner'){ const c = st.tuner.cents; pr = `Tune<small>${esc(st.tuner.tuning)} · ${c == null ? esc(st.tuner.status) : Math.abs(c) <= 5 ? 'In tune' : c < 0 ? 'Flat: tighten the string a little' : 'Sharp: loosen the string a little'}</small>`; }
    else pr = st.next ? `Up next: <em>${esc(st.next)}</em><small>${st.today} of ${st.goal} in today’s practice · pick a lesson on your phone and the whole neck shows up here</small>`
      : `Fretwise<small>Pick a lesson on your phone. The whole neck shows up here while you play.</small>`;
    if (this.prev !== pr){ this.prev = pr; $('#tvprompt').innerHTML = pr; }
    const fb = st.fb || {}; $('#tvfb').className = 'tvfb' + (/\bgood\b/.test(fb.cls || '') ? ' good' : /\bbad\b/.test(fb.cls || '') ? ' bad' : ''); $('#tvfb').textContent = fb.t || '';
    if ($('#tvmeter').innerHTML !== (st.meter || '')) $('#tvmeter').innerHTML = st.meter || '';
    $('#tvboard').hidden = sc === 'tuner'; $('#tvtun').hidden = sc !== 'tuner';
    if (sc !== 'tuner'){
      const M = (st.marks || []).map(m => { const c = Object.assign({}, m); delete c.pop; return c; });
      if (st.win) M.unshift({ kind:'window', f:st.win[0], f2:st.win[1] });
      const k = JSON.stringify(M); if (k !== this.mk){ this.mk = k; drawMarks(M); }
    }
    if (sc === 'tuner') this.tuner(st.tuner);
    const p = st.piano || { keys:[], cap:'—' }, pk = JSON.stringify(p);
    if (pk !== this.pk){ this.pk = pk; renderPiano(new Map(p.keys.map(([m, fill, label, faint]) => [m, { fill, label, faint:!!faint }])), p.cap); }
  },
  tuner(t){
    const n = $('#tvnote'), ok = t.cents != null && Math.abs(t.cents) <= 5;
    n.textContent = t.note || (t.on ? '–' : '♪'); n.classList.toggle('ok', ok); n.classList.toggle('wait', !t.note);
    $('#tvcents').textContent = t.note ? `${t.cents > 0 ? '+' : ''}${t.cents} cents · ${t.hz} Hz` : t.on ? (t.heard ? 'Hearing sound…' : 'Listening…') : '';
    $('#tvneedle').style.transform = `rotate(${t.cents != null ? Math.max(-60, Math.min(60, t.cents * 1.2)) : 0}deg)`;
    const strs = t.strings.map((x, i) => `<span class="${i === t.str ? 'cur' : ''}">${esc(x)}</span>`).join('');
    if ($('#tvstrs').innerHTML !== strs) $('#tvstrs').innerHTML = strs;
    const lv = $('#tvlvl'); lv.hidden = !t.on; lv.classList.toggle('on', !!t.heard); lv.firstChild.style.transform = `scaleX(${t.level || 0})`;
  }
};
const DISPLAY = !!window.__FW_DISPLAY || /[?&]display\b/.test(location.search);

const MODES = { learn:Learn, practice:Practice, explore:ExploreTab, tune:Tuner };
const ALIAS = { drill:'practice', chords:'explore', scales:'explore', tuner:'tune', life:'explore' };
Life.bind();
function renderStreak(){
  const el = $('#daystreak'); if (!el) return;
  const n = dayStreak(), t = days[todayKey()] || 0;
  $('#streakn').textContent = n;
  el.classList.toggle('done', t >= DAILY_GOAL);
  el.setAttribute('aria-label', `${n}-day streak. Today's practice: ${Math.min(t, DAILY_GOAL)} of ${DAILY_GOAL}.`);
  el.title = t >= DAILY_GOAL ? 'Today\'s practice is done' : `Today: ${Math.min(t, DAILY_GOAL)} of ${DAILY_GOAL}`;
}
function syncGlobals(){
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
}
function go(t, fromHash){
  if (ALIAS[t]){ if (t === 'chords' || t === 'scales') S.exmode = t; t = ALIAS[t]; }
  if (!MODES[t]) t = 'learn';
  if (tab !== t && MODES[tab] && MODES[tab].leave) MODES[tab].leave();
  tab = t; if (!fromHash && location.hash !== '#' + t) history.replaceState(null, '', '#' + t);
  syncGlobals(); MODES[tab].render();
}
$('.tabbar').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  if (b.dataset.tab === tab){ if (tab === 'learn' && Learn.detail){ Learn.detail = false; S.learn.phase = 'study'; Learn.reset(); Learn.render(); } window.scrollTo({ top:0, behavior:'smooth' }); return; }
  go(b.dataset.tab); window.scrollTo(0, 0);
});
$('#daystreak').addEventListener('click', () => Life.start({ type:'daily' }));
$('#main').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; actx(); MODES[tab].act(b.dataset.act, b.dataset.v); });
$('#main').addEventListener('input', e => { MODES[tab].input && MODES[tab].input(e); });
document.addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return; if (!$('#sheet').hidden || !$('#welcome').hidden) return; MODES[tab].key && MODES[tab].key(e); });
window.addEventListener('hashchange', () => go(location.hash.slice(1), true));
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (Life.open && Life.flat){ Life.fitFlat(); return; } if (ensureBoard()) MODES[tab].render(); }, 120); });
if (/[?&]fwtest\b/.test(location.search)) window.__fw = { Life, Learn, S, LEARN, KINDS, Review, Practice, learnProg, Mic, Tuner, TV, TVView, actx: () => ac };
if (DISPLAY){ TVView.boot(); return; }
ensureBoard();
go((location.hash || '#learn').slice(1), true);
renderStreak();
if (!store.get('fretwise.welcomed2', false)) Welcome.show();
TV.hello();
window.__openV = (r, q) => openVoicing(r, q).frets;   // test hook for automated checks only
})();
