<title>Fretwise</title>
<style>

@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}

<style>
/* Layout: guitar-shop calm. Sticky glass piano strip over a rosewood neck; controls sit in quiet cards below. */
:root{
  --bg:#EDF1F0; --surface:#FBFCFC; --ink:#17201E; --muted:#5B6966; --line:#D3DBD9; --chip:#E4EAE8;
  --accent:#2D6A8A; --accent-ink:#FFFFFF; --amber:#C27A2C; --good:#2F8656; --bad:#C1463B;
  --glass:rgba(244,247,246,.66); --key-w:rgba(255,255,255,.86); --key-b:rgba(24,30,29,.86); --key-line:rgba(23,32,30,.24); --key-label:#5B6966;
  --wood-a:#4C2D1E; --wood-b:#2D1A12; --fretwire:#CBD2D5; --bone:#ECE4D1; --pearl:#F2EDE3; --string:#DCE1E3; --wound:#C4AB7A;
  --dot-ink:#1C1612; --on-wood:#D9CDBB; --shade:rgba(12,9,7,.58); --barre:rgba(242,237,227,.22);
  --f-display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --f-body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101615; --surface:#161E1D; --ink:#E6ECEA; --muted:#8FA09C; --line:#27322F; --chip:#1E2826;
  --accent:#79B2D1; --accent-ink:#0B1A22; --amber:#E2A158; --good:#5DBE88; --bad:#E5766A;
  --glass:rgba(16,22,21,.66); --key-w:rgba(232,237,235,.84); --key-b:rgba(6,9,9,.9); --key-line:rgba(0,0,0,.45); --key-label:#4E5B58;
  --wood-a:#3D2418; --wood-b:#20120C; --shade:rgba(5,4,3,.62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101615; --surface:#161E1D; --ink:#E6ECEA; --muted:#8FA09C; --line:#27322F; --chip:#1E2826;
  --accent:#79B2D1; --accent-ink:#0B1A22; --amber:#E2A158; --good:#5DBE88; --bad:#E5766A;
  --glass:rgba(16,22,21,.66); --key-w:rgba(232,237,235,.84); --key-b:rgba(6,9,9,.9); --key-line:rgba(0,0,0,.45); --key-label:#4E5B58;
  --wood-a:#3D2418; --wood-b:#20120C; --shade:rgba(5,4,3,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:16px 12px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.logo{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1}
.logo i{font-style:normal;color:var(--amber)}
.tune{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:5px}
.tabs{display:flex;gap:2px;background:var(--chip);border-radius:12px;padding:3px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.globals{display:flex;gap:8px;align-items:center}
.pianobar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-block:1px solid var(--line)}
.pianobar .wrap{display:flex;align-items:center;gap:16px;padding-block:8px}
#piano{display:block;width:100%;max-width:760px;margin:0 auto;height:auto}
.pcap{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:120px;flex:none;line-height:1.35}
.pcap b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:0;text-transform:none;font-weight:700}
@media (max-width:760px){.pcap{display:none}}
main{padding-block:18px 48px}
.boardcard{overflow:hidden}
#board{display:block;width:100%;height:auto;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#board.v{max-width:420px}
#board .hit{fill:transparent;cursor:pointer}
#board .hit:hover{fill:rgba(255,255,255,.07)}
#board text{font-family:var(--f-body);pointer-events:none}
#board .dl{font-weight:600;dominant-baseline:central;text-anchor:middle}
#board .num{font-family:var(--f-mono);font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
#board .num.k{fill:var(--ink);font-weight:600}
#board .sn{font-family:var(--f-mono);font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
#board .mute{fill:var(--muted);font-size:18px;text-anchor:middle;dominant-baseline:central;font-weight:500}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:.2}}
@media (prefers-reduced-motion:reduce){.pulse,.pop{animation:none}}

#panel{display:grid;gap:14px;align-items:start;grid-template-columns:repeat(12,1fr);margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;grid-column:span 12}
@media (min-width:900px){.c4{grid-column:span 4}.c5{grid-column:span 5}.c7{grid-column:span 7}.c8{grid-column:span 8}.c6{grid-column:span 6}}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13.5px;font-weight:500;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.sq{border-radius:8px;min-width:40px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:.95;letter-spacing:-.03em}
.big small{font-size:22px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:8px}
.sub{color:var(--muted);font-size:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:12px 0 0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.empty{color:var(--muted);font-size:15px;max-width:34ch}
.tips{display:grid;gap:8px}
.tip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;cursor:pointer}
.tip b{font-family:var(--f-display);font-size:16px;font-weight:700;display:block}
.tip span{color:var(--muted);font-size:13.5px}
.tip[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 9%,transparent)}
.prompt{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.prompt em{font-style:normal;color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{border-left:2px solid var(--line);padding-left:10px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pad.n7{grid-template-columns:repeat(7,1fr)}
.key{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:52px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;padding:0}
.key small{font-size:12px;color:var(--muted);font-weight:600}
.key:hover{border-color:var(--muted)}
.key.good{background:var(--good);border-color:var(--good);color:#fff}
.key.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.key.good small,.key.bad small{color:inherit}
.fb{min-height:22px;font-size:14px;font-weight:600}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted)}
.chordname{font-family:var(--f-display);font-weight:800;font-size:52px;line-height:1;letter-spacing:-.02em}
.formula{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tone{display:flex;flex-direction:column;align-items:center;min-width:44px;border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.tone b{font-family:var(--f-display);font-size:18px}
.tone span{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tone.r{border-color:var(--amber)}
.vnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vnav .mono{font-size:13px;color:var(--muted)}
.dia{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dia button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dia button b{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:600}
.dia button span{font-family:var(--f-display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dia button[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
@media (max-width:560px){.dia{grid-template-columns:repeat(4,minmax(0,1fr))}}
#cof{width:100%;max-width:300px;display:block;margin:0 auto}
#cof .w{cursor:pointer;stroke:var(--surface);stroke-width:2}
#cof text{font-family:var(--f-display);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts .key{height:56px;font-size:20px}
@media (max-width:699px){
  .big{font-size:52px}
  .chordname{font-size:44px}
  .prompt{font-size:22px}
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
  main.docked{padding-bottom:230px}
  .stats b{font-size:20px}
}
main{display:flex;flex-direction:column}
main.lesson-first #panel{order:-1;margin:0 0 14px}
.pathbox summary{cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);list-style:none;margin-bottom:6px}
.pathbox summary::-webkit-details-marker{display:none}
.pathbox[open] summary{display:none}
@media (max-width:699px){.pathbox summary{display:block!important}.pathbox summary::after{content:" ▾"}}
.streakpill{font-weight:600}
.dockq{display:none}
@media (max-width:699px){
  .dock .dockq{display:block;grid-column:1 / -1;font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:2px}
  .dockq b.g{color:var(--good)} .dockq b.b{color:var(--bad)}
  main.lesson-first.practicing .ldesc, main.lesson-first.practicing .pathbox{display:none}
  main.lesson-first.practicing #panel > .card:last-child{display:none}
}
.gset{display:none;padding:5px 9px;line-height:0}
@media (max-width:699px){
  .bar{display:grid;grid-template-columns:1fr auto auto;gap:10px 8px;padding-block:12px 10px}
  .brand{margin:0}
  .logo{font-size:24px}
  .tune{display:none}
  .gset{display:inline-block}
  .tabs{grid-column:1 / -1;grid-row:3}
  .globals{display:none;grid-column:1 / -1;grid-row:2}
  .bar.open .globals{display:flex;flex-wrap:wrap}
}
.streakpill[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.step.daily{border:1px solid var(--line);margin-bottom:6px}
.step small{color:var(--muted);margin-left:4px}
.path{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:10px;cursor:pointer;font-size:14px}
.step:hover{background:var(--chip)}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--muted)}
.step.done .n{background:var(--good);border-color:var(--good);color:#fff}
.step.cur{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.step.cur .n{border-color:var(--accent);color:var(--accent)}
.ntab{border-collapse:collapse;font-size:14px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:699px){.cols2{grid-template-columns:1fr}}
.ntab th{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:600;padding:4px 8px;text-align:left}
.ntab td{padding:3px 4px}
#welcome{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
#welcome[hidden]{display:none}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.wart svg{width:100%;max-width:260px;display:block;margin:0 auto 14px}
.wdots{display:flex;gap:6px;margin-bottom:14px}
.wdots span{width:22px;height:4px;border-radius:2px;background:var(--line)}
.wdots span.on{background:var(--accent)}
#life{position:fixed;inset:0;z-index:30;background:var(--bg);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#lifecv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ltop,.lbot{position:absolute;left:0;right:0;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);pointer-events:none}
.ltop{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.lbot{bottom:0;padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ltop button,.lbot button{pointer-events:auto}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;font-size:14px;cursor:pointer}
.lpos{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-left:auto}
.lstat{font-size:13px;color:var(--muted)} .lstat b{color:var(--ink);font-family:var(--f-display);font-size:17px}
.lprompt{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin-top:6px}
.lprompt em{font-style:normal;color:var(--amber)}
.lprompt small{display:block;font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted);margin-top:2px}
.lfb{font-weight:600;font-size:14px;min-height:20px}
.lfb.good{color:var(--good)} .lfb.bad{color:var(--bad)}
main.noboard .boardcard{display:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,440px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <span class="logo">Fret<i>wise</i></span>
      <span class="tune">Standard tuning · E A D G B E</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Modes">
      <button role="tab" data-tab="learn">Learn</button>
      <button role="tab" data-tab="explore">Explore</button>
      <button role="tab" data-tab="drill">Drill</button>
      <button role="tab" data-tab="chords">Chords</button>
      <button role="tab" data-tab="scales">Scales &amp; Keys</button>
      <button role="tab" data-tab="life">Life-size</button>
      <button role="tab" data-tab="tuner">Tuner</button>

  for (const c of [g.c0 + g.sp * 1.5, g.c0 + g.sp * 4.5]){ const [x,y] = g.xy(g.along(12), c); h += `<circle cx="${x}" cy="${y}" r="${v?6:5.5}" style="fill:var(--pearl);opacity:.85"/>`; }

}
function ensureBoard(){

/* marks: {s,f,kind,pc,text,fill} kinds: dot root ghost ring ring2 target good bad mute heat shade link barre */
function drawMarks(M){
  const g = G, R = g.R; let under = '', mid = '', over = '';
  for (const m of M){
    if (m.kind === 'shade' && m.f === 0) continue;
    if (m.kind === 'shade' || m.kind === 'heat'){
      const a1 = m.f === 0 ? 2 : g.pos(m.f - 1) + 1.5, a2 = m.f === 0 ? g.nut - 6 : g.pos(m.f) - 1.5, c = g.cr(m.s);
      under += `<rect ${g.rect(a1, a2, c - g.sp/2 + 1, c + g.sp/2 - 1)} rx="3" style="fill:${m.fill || 'var(--shade)'}"/>`;
      continue;
    }
    if (m.kind === 'link'){
      under += `<line ${g.line(g.along(m.f), g.cr(m.s), g.along(m.f2), g.cr(m.s2))} style="stroke:var(--amber);stroke-width:3;stroke-dasharray:5 5;stroke-linecap:round"/>`;
      continue;
    }
    if (m.kind === 'barre'){
      const a = g.along(m.f), c1 = Math.min(g.cr(m.s), g.cr(m.s2)) - R + 2, c2 = Math.max(g.cr(m.s), g.cr(m.s2)) + R - 2;
      under += `<rect ${g.rect(a - R + 2, a + R - 2, c1, c2)} rx="${R - 2}" style="fill:var(--barre)"/>`;
      continue;
    }
    const [x,y] = g.xy(g.along(m.f), g.cr(m.s));
    if (m.kind === 'mute'){ over += `<text class="mute" x="${x}" y="${y}">×</text>`; continue; }
    if (m.kind === 'ring'){ over += `<circle cx="${x}" cy="${y}" r="${R + 4}" style="fill:none;stroke:var(--amber);stroke-width:3"/>`; continue; }
    if (m.kind === 'ring2'){ over += `<circle cx="${x}" cy="${y}" r="${R + 3.5}" style="fill:none;stroke:var(--amber);stroke-width:1.6;stroke-dasharray:3 3"/>`; continue; }
    if (m.kind === 'target'){
      over += `<g id="tgt"><circle class="pulse" cx="${x}" cy="${y}" r="${R + 1}" style="fill:var(--amber);stroke:#fff;stroke-width:2"/><text class="dl" x="${x}" y="${y}" style="fill:#fff;font-size:15px">?</text></g>`;
      continue;
    }
    const ghost = m.kind === 'ghost';
    let fill = m.fill || (m.pc != null ? noteFill(m.pc) : 'var(--pearl)'), ink = 'var(--dot-ink)';
    if (m.kind === 'good'){ fill = 'var(--good)'; ink = '#fff'; }
    if (m.kind === 'bad'){ fill = 'var(--bad)'; ink = '#fff'; }
    const r = ghost ? R * 0.8 : R, op = ghost ? 'opacity:.5;' : '';
    const cls = m.pop ? ' class="pop"' : '';
    const shape = (m.kind === 'root' || m.root)
      ? `<rect${cls} x="${x - r}" y="${y - r}" width="${2*r}" height="${2*r}" rx="${r*0.38}" style="${op}fill:${fill};stroke:rgba(0,0,0,.35);stroke-width:1"/>`
      : `<circle${cls} cx="${x}" cy="${y}" r="${r}" style="${op}fill:${fill};stroke:rgba(0,0,0,.3);stroke-width:1"/>`;
    const t = m.text != null && m.text !== '' ? `<text class="dl" x="${x}" y="${y}" style="${ghost ? 'opacity:.8;' : ''}fill:${ink};font-size:${ghost ? 10 : (String(m.text).length > 2 ? 10.5 : 12.5)}px">${esc(m.text)}</text>` : '';
    mid += shape + t;
  }
  $('#marks').innerHTML = under + mid + over;
}

function cellsIn(strings, lo, hi){ const out = []; for (const s of strings) for (let f = lo; f <= hi; f++) out.push({s, f}); return out; }

/* ---------- piano ---------- */
const piano = $('#piano');
function renderPiano(hl = new Map(), caption = '—'){
  const WW = 22, WH = 76, BW = 13, BH = 47, whites = [];
  for (let m = LO; m <= HI; m++) if (NAT[pcOf(m)]) whites.push(m);
  let h = '', blacks = '';
  whites.forEach((m, i) => {
    const o = hl.get(m), x = i * WW;
    h += `<rect x="${x + .5}" y=".5" width="${WW - 1}" height="${WH - 1}" rx="3" style="fill:${o ? o.fill : 'var(--key-w)'};stroke:var(--key-line);stroke-width:1;${o && o.faint ? 'opacity:.55' : ''}"/>`;
    if (o && o.label) h += `<text x="${x + WW/2}" y="${WH - 11}" style="font:700 10px var(--f-body);fill:#1C1612;text-anchor:middle">${esc(o.label)}</text>`;
    else if (pcOf(m) === 0) h += `<text x="${x + WW/2}" y="${WH - 9}" style="font:500 8.5px var(--f-mono);fill:var(--key-label);text-anchor:middle">C${octOf(m)}</text>`;
  });
  for (let m = LO; m <= HI; m++){
    if (NAT[pcOf(m)]) continue;
    const wi = whites.indexOf(m - 1), x = (wi + 1) * WW - BW / 2, o = hl.get(m);
    blacks += `<rect x="${x}" y="0" width="${BW}" height="${BH}" rx="2.5" style="fill:${o ? o.fill : 'var(--key-b)'};stroke:rgba(0,0,0,.5);stroke-width:1;${o && o.faint ? 'opacity:.6' : ''}"/>`;
    if (o && o.label) blacks += `<text x="${x + BW/2}" y="${BH - 8}" style="font:700 8px var(--f-body);fill:#1C1612;text-anchor:middle">${esc(o.label.replace(/[♯♭]/,''))}</text>`;
  }
  piano.setAttribute('viewBox', `0 0 ${whites.length * WW} ${WH}`);
  piano.innerHTML = h + blacks;
  $('#pcap').innerHTML = `Sounding pitch<b>${esc(caption)}</b>`;
}
function hlNotes(midis, { faintPcs = null, labels = true, rootPc = null } = {}){
  const hl = new Map();
  if (faintPcs) for (let m = LO; m <= HI; m++) if (faintPcs.includes(pcOf(m))) hl.set(m, { fill: noteFill(pcOf(m)), faint: true });
  for (const m of midis) if (m >= LO && m <= HI) hl.set(m, { fill: noteFill(pcOf(m)), label: labels ? nn(pcOf(m)) : '' });
  return hl;
}

const chip = (act, v, label, on, cls = '') => `<button class="chip ${cls}" data-act="${act}" data-v="${v}" aria-pressed="${!!on}">${label}</button>`;

/* ================= EXPLORE ================= */
const TIPS = [
  { t:'B–C and E–F are neighbors', d:'Natural notes sit two frets apart, except B→C and E→F, which touch. Find those pairs and the other naturals fall into place.',
    marks(M){ for (const {s,f} of cellsIn([0,1,2,3,4,5], 0, FRETS)){ const pc = pcOf(midiAt(s,f)); if (!NAT[pc]) continue; M.push({s, f, pc, text:nn(pc), kind:[4,5,11,0].includes(pc) ? 'dot' : 'ghost'}); } } },
  { t:'The fifth-fret rule', d:'Fret 5 on any string matches the next string open. The G string is the exception: fret 4 matches the open B.',
    marks(M){ for (let s = 0; s < 5; s++){ const f = s === 3 ? 4 : 5, pc = pcOf(midiAt(s,f)); M.push({s, f, pc, text:nn(pc), kind:'dot'}, {s:s+1, f:0, pc, text:nn(pc), kind:'dot'}, {kind:'link', s, f, s2:s+1, f2:0}); } } },
  { t:'Fret 12 starts the neck over', d:'Fret 12 is each open string an octave higher, so frets 12–15 repeat frets 0–3. The double dot marks it.',

const Explore = {

/* ================= DRILL ================= */
const RANGES = [[[0,5],'Frets 0–5'],[[0,12],'0–12'],[[5,12],'5–12'],[[7,15],'7–15'],[[0,15],'Whole neck']];
const Drill = {
  cur:null, targets:null, found:null, flash:null, fb:null, answered:null, lock:false, t0:0, sess:{n:0, ok:0, ms:0, streak:0}, timer:null, lastPc:null,
  pool(){ const d = S.drill; return cellsIn(d.strings, d.range[0], d.range[1]).filter(c => !d.naturals || NAT[pcOf(midiAt(c.s,c.f))]); },
  inPool(s, f){ const d = S.drill; return d.strings.includes(s) && f >= d.range[0] && f <= d.range[1] && (!d.naturals || NAT[pcOf(midiAt(s,f))]); },
  next(){

    if (S.drill.type === 'name'){

      const w = pool.map(c => { const st = stats.c[c.s + '-' + c.f]; let x = st ? 1 + 4 * (1 - st[1] / st[0]) : 3; if (prev && prev.s === c.s && prev.f === c.f) x = 0; return x; });

      const pc = pick(pcs.length ? pcs : [pcOf(midiAt(pool[0].s, pool[0].f))]); this.lastPc = pc;
      this.cur = { pc };
      this.targets = pool.filter(c => pcOf(midiAt(c.s,c.f)) === pc);
      this.found = new Set();
    }
    this.t0 = performance.now();
  },
  render(scrollTo){
    const d = S.drill; if (!this.cur) this.next();
    const M = [];
    for (const {s,f} of cellsIn([0,1,2,3,4,5], 0, FRETS)) if (!d.strings.includes(s) || f < d.range[0] || f > d.range[1]) M.push({s, f, kind:'shade'});
    if (d.heat) for (const c of this.pool()){ const st = stats.c[c.s + '-' + c.f]; if (!st) continue; const a = st[1] / st[0]; M.push({s:c.s, f:c.f, kind:'heat', fill: a >= .85 ? 'color-mix(in srgb,var(--good) 45%,transparent)' : a >= .6 ? 'color-mix(in srgb,var(--amber) 50%,transparent)' : 'color-mix(in srgb,var(--bad) 55%,transparent)'}); }

    }

    $('#panel').innerHTML = `
      <div class="card c7 stack"><div>${play}</div>

          <div class="stat"><b>${acc}</b><span>Accuracy</span></div>
          <div class="stat"><b>${avg}</b><span>Avg. time</span></div>
        </div></div>
      <div class="card c5 stack">
        <div><p class="lbl">Game</p>${seg('type', d.type, [['name','Name the note'],['find','Find the note']])}</div>
        <div><p class="lbl">Strings</p><div class="row">${[5,4,3,2,1,0].map(s => chip('str', s, `${SNAME[s]}<span class="sr"> ${SORD[s]} string</span>`, d.strings.includes(s), 'sq')).join('')}</div></div>
        <div><p class="lbl">Frets</p><div class="row">${RANGES.map(([r, l]) => chip('range', r.join('-'), l, d.range[0] === r[0] && d.range[1] === r[1])).join('')}</div></div>
        <div class="row">${toggle('naturals', 'Natural notes only', d.naturals)}${toggle('heat', 'Show weak spots', d.heat)}<button class="chip" data-act="reset">Reset history</button></div>
        <p class="hint">Name the note picks your weakest frets more often. Weak spots shades each fret by your accuracy there: green is solid, amber is shaky, red needs work.</p>
      </div>`;
    $('#main').classList.toggle('docked', !!(this.cur && d.type === 'name'));
  },
  answer(pc){
    if (this.lock || !this.cur || S.drill.type !== 'name') return;
    const {s, f} = this.cur, m = midiAt(s,f), correct = pcOf(m), ok = pc === correct, ms = performance.now() - this.t0;
    const k = s + '-' + f, st = stats.c[k] || [0,0,0]; st[0]++; if (ok){ st[1]++; st[2] += ms; } stats.c[k] = st;
    const ss = this.sess; ss.n++;
    if (ok){ ss.ok++; ss.ms += ms; ss.streak++; if (ss.streak > stats.best) stats.best = ss.streak; this.fb = {cls:'good', t:`${both(correct)}. ${(ms/1000).toFixed(1)}s`}; }
    else { ss.streak = 0; this.fb = {cls:'bad', t:`That was ${both(correct)}, not ${both(pc)}.`}; }
    saveStats(); play(m); haptic(ok ? 'success' : 'error');
    this.answered = pc; this.lock = true; this.render();
    this.timer = setTimeout(() => { this.next(); this.render(true); }, ok ? 700 : 1700);
  },
  cell(s, f){
    if (S.drill.type === 'name'){ if (this.answered != null){ clearTimeout(this.timer); this.next(); this.render(true); } return; }
    if (!this.cur || !this.inPool(s,f) || this.lock) { play(midiAt(s,f), 0, .5); return; }
    const k = s + '-' + f, pc = pcOf(midiAt(s,f)); play(midiAt(s,f));
    if (pc === this.cur.pc){
      if (!this.found.has(k)){ this.found.add(k); this.sess.n++; this.sess.ok++; this.sess.streak++; if (this.sess.streak > stats.best){ stats.best = this.sess.streak; saveStats(); } }
      this.fb = null; this.flash = null; haptic('success');
      if (this.found.size === this.targets.length){
        const t = ((performance.now() - this.t0) / 1000).toFixed(1); this.sess.ms += performance.now() - this.t0;
        this.fb = {cls:'good', t:`All ${this.targets.length} found in ${t}s.`}; this.lock = true;
        this.timer = setTimeout(() => { this.next(); this.render(); }, 1100);
      }
    } else {
      this.sess.n++; this.sess.streak = 0; this.flash = {s, f}; haptic('error'); this.fb = {cls:'bad', t:`That's ${both(pc)}.`};
      clearTimeout(this.timer); this.timer = setTimeout(() => { this.flash = null; this.render(); }, 900);
    }
    this.render();
  },
  act(a, v){
    const d = S.drill;
    if (a === 'ans'){ this.answer(+v); return; }
    if (a === 'listen'){ Ear.toggle(r => this.heard(r)).then(() => this.render()); return; }
    if (a === 'type'){ d.type = v; this.cur = null; this.revealed = false; }
    if (a === 'str'){ const s = +v; if (d.strings.includes(s)){ if (d.strings.length > 1) d.strings = d.strings.filter(x => x !== s); } else d.strings = [...d.strings, s].sort(); this.cur = null; }
    if (a === 'range'){ d.range = v.split('-').map(Number); this.cur = null; }
    if (a === 'naturals'){ d.naturals = !d.naturals; this.cur = null; }
    if (a === 'heat') d.heat = !d.heat;
    if (a === 'reset'){ stats.c = {}; stats.best = 0; this.sess = {n:0, ok:0, ms:0, streak:0}; saveStats(); }
    if (a === 'reveal'){ this.revealed = true; this.lock = true; this.fb = {cls:'', t:'Here they are. Next note in a moment.'}; this.timer = setTimeout(() => { this.revealed = false; this.next(); this.render(); }, 2200); }
    if (a === 'skip'){ this.revealed = false; this.next(); }
    if (!this.cur) this.next();
    save(); this.render(a === 'type' || a === 'skip');
  },
  heard(r){
    if (!this.cur || this.lock) return;
    const pc = pcOf(r);
    if (S.drill.type === 'name'){ this.answer(pc); return; }
    const open = this.targets.filter(c => !this.found.has(c.s + '-' + c.f));
    const hit = open.find(c => midiAt(c.s, c.f) === r) || open.find(c => pcOf(midiAt(c.s, c.f)) === pc);
    if (hit) this.cell(hit.s, hit.f);
    else if (pc !== this.cur.pc){ this.sess.n++; this.sess.streak = 0; this.fb = { cls:'bad', t:`Heard ${both(pc)}.` }; this.render(); }
  },
  key(e){
    if (S.drill.type !== 'name' || e.metaKey || e.ctrlKey || e.altKey) return;
    const i = 'cdefgab'.indexOf(e.key.toLowerCase()); if (i < 0) return;
    let pc = LETTER_PC[i]; if (e.shiftKey) pc = (pc + 1) % 12;
    if (S.drill.naturals && !NAT[pc]) return;
    e.preventDefault(); this.answer(pc);
  },
  leave(){ Ear.stop(); clearTimeout(this.timer); this.lock = false; if (this.answered != null) this.next(); $('#main').classList.remove('docked'); }
};

/* ================= CHORDS ================= */
const Chords = {
  quiz:null, score:{n:0, ok:0, streak:0},
  name(r, q){ return chordRoot(r) + CQ[q].sym; },
  voicingMarks(vc, r, q, showText){
    const M = [], c = S.chords, root = chordRoot(r);
    const played = vc.frets.map((f, s) => f == null ? null : {s, f}).filter(Boolean);
    const fretted = played.filter(p => p.f > 0), lo = fretted.length ? Math.min(...fretted.map(p => p.f)) : 0;
    if (lo > 0 && played.every(p => p.f >= lo)){ const at = played.filter(p => p.f === lo); if (at.length >= 2) M.push({kind:'barre', f:lo, s:at[0].s, s2:at[at.length - 1].s}); }
    for (let s = 0; s < 6; s++){
      const f = vc.frets[s];
      if (f == null){ M.push({s, f:0, kind:'mute'}); continue; }
      const m = midiAt(s,f), pc = pcOf(m), iv = CQ[q].f.find(x => (r + IV[x]) % 12 === pc);
      const text = !showText ? '' : c.labels === 'int' ? ivDisp(iv) : spell(root, iv);
      M.push({s, f, pc, text, kind:'dot', root: showText && pc === r, fill: showText ? undefined : 'var(--pearl)'});
    }
    return M;
  },
  midis(vc){ return vc.frets.map((f, s) => f == null ? null : midiAt(s,f)).filter(x => x != null); },
  render(){ S.chords.mode === 'quiz' ? this.renderQuiz() : this.renderStudy(); },
  renderStudy(){
    const c = S.chords, r = c.root, q = c.q, vs = genVoicings(r, q);
    if (c.v >= vs.length) c.v = 0;
    const vc = vs[c.v], root = chordRoot(r), M = [];
    if (c.map) for (const {s,f} of cellsIn([0,1,2,3,4,5], 0, FRETS)){
      const pc = pcOf(midiAt(s,f)), iv = CQ[q].f.find(x => (r + IV[x]) % 12 === pc);
      if (iv && !(vc && vc.frets[s] === f)) M.push({s, f, pc, kind:'ghost', root: pc === r, text: c.labels === 'int' ? ivDisp(iv) : spell(root, iv)});
    }
    if (vc) M.push(...this.voicingMarks(vc, r, q, true));
    drawMarks(M);
    renderPiano(vc ? hlNotes(this.midis(vc)) : new Map(), this.name(r, q));
    const posLabel = v => v.open && v.lo <= 4 ? 'Open position' : `${v.shape === 'Jazz' ? 'Jazz voicing' : v.shape + ' shape'} · fret ${v.lo}`;
    $('#panel').innerHTML = `
      <div class="card c5 stack">
        <div class="row" style="justify-content:space-between">${seg('mode', c.mode, [['study','Study'],['quiz','Quiz me']])}</div>
        <div><div class="chordname">${esc(this.name(r, q))}</div><div class="sub">${root} ${CQ[q].name.toLowerCase()}</div>
          <div class="formula">${CQ[q].f.map(iv => `<div class="tone ${iv === '1' ? 'r' : ''}"><b>${spell(root, iv)}</b><span>${ivDisp(iv)}</span></div>`).join('')}</div></div>
        <div class="vnav">
          <button class="btn ghost" data-act="vprev" aria-label="Previous voicing" ${vs.length > 1 ? '' : 'disabled'}>‹</button>
          <span class="mono">${vc ? `${posLabel(vc)} · ${c.v + 1} of ${vs.length}` : 'No voicing in reach'}</span>
          <button class="btn ghost" data-act="vnext" aria-label="Next voicing" ${vs.length > 1 ? '' : 'disabled'}>›</button>
          <button class="btn" data-act="strum">Strum</button>
        </div>
        <p class="hint">Square dots are the root. Shapes are named for the open chord they come from (the CAGED system), so an A-shape barre is an open A chord moved up the neck.</p>
      </div>
      <div class="card c7 stack">
        <div><p class="lbl">Root</p><div class="row">${[...Array(12).keys()].map(p => chip('root', p, chordRoot(p), p === r, 'sq')).join('')}</div></div>
        <div><p class="lbl">Quality</p><div class="row">${CQ_MAIN.map(k => chip('q', k, k === 'maj' ? 'Major' : k === 'min' ? 'Minor' : CQ[k].sym, k === q)).join('')}</div></div>
        <div class="row">${seg('labels', c.labels, [['int','Intervals'],['note','Note names']])}${toggle('map', 'Chord tones on the whole neck', c.map)}</div>
      </div>
      <div class="card">${this.capoCard()}</div>`;
  },
  capoCard(){
    const c = S.chords, capo = c.capo ?? 2, key = c.capoKey ?? 9, SHP = [7,0,2,9,4];
    const opts = SHP.map(sh => ({ sh, fret:(key - sh + 12) % 12 })).filter(o => o.fret <= 7).sort((a,b) => a.fret - b.fret);
    return `<p class="lbl">Capo helper</p>
      <div class="cols2">
        <div class="stack" style="gap:8px"><span class="sub">Capo on fret</span><div class="row">${[0,1,2,3,4,5,6,7].map(n => chip('capo', n, n || 'None', n === capo, 'sq')).join('')}</div>
          <table class="ntab"><thead><tr><th>Shapes you play</th><th>Sounds in</th></tr></thead><tbody>${SHP.map(sh => `<tr><td><b>${chordRoot(sh)}</b> shapes</td><td>${chordRoot((sh + capo) % 12)}</td></tr>`).join('')}</tbody></table></div>
        <div class="stack" style="gap:8px"><span class="sub">The song is in</span><div class="row">${[...Array(12).keys()].map(p => chip('capokey', p, chordRoot(p), p === key, 'sq')).join('')}</div>
          <p style="margin:0">${opts.map(o => o.fret ? `Play <b>${chordRoot(o.sh)}</b> shapes with the capo on fret <b>${o.fret}</b>` : `Play <b>${chordRoot(o.sh)}</b> shapes, no capo`).join('<br>')}</p></div>
      </div>
      <p class="hint">Bluegrass guitarists mostly play G, C, D and A shapes and capo to match the singer. A key of A is often capo 2 with G shapes, B is capo 4 with G or capo 2 with A.</p>`;
  },
  newQuiz(){
    const c = S.chords; let r, q, vs;
    for (let tries = 0; tries < 40; tries++){
      r = rand(12); q = pick(c.quizQ); vs = genVoicings(r, q).filter(v => v.lo <= 10);
      if (vs.length) break;
    }
    const vc = pick(vs), answer = r + '|' + q, opts = new Set([answer]);
    let guard = 0;
    while (opts.size < 4 && guard++ < 100){
      const alt = Math.random() < .5 ? (r + '|' + pick(c.quizQ.length > 1 ? c.quizQ : CQ_MAIN)) : (pick([1,2,5,7,10,11].map(x => (r + x) % 12)) + '|' + q);
      opts.add(alt);
    }
    this.quiz = { r, q, vc, answer, opts:[...opts].sort(() => Math.random() - .5), picked:null };
    setTimeout(() => strum(this.midis(vc)), 120);
  },
  renderQuiz(){
    const c = S.chords; if (!this.quiz) this.newQuiz();
    const z = this.quiz, done = z.picked != null;
    drawMarks(this.voicingMarks(z.vc, z.r, z.q, done));
    renderPiano(done ? hlNotes(this.midis(z.vc)) : new Map(), done ? this.name(z.r, z.q) : '?');
    const sc = this.score;
    $('#panel').innerHTML = `
      <div class="card c7 stack">
        <div class="row">${seg('mode', c.mode, [['study','Study'],['quiz','Quiz me']])}</div>
        <div class="prompt">${done ? (z.picked === z.answer ? 'Right. ' : 'Not quite. ') + `This is <em>${esc(this.name(z.r, z.q))}</em>.` : 'Which chord is this shape?'}</div>
        <div class="opts">${z.opts.map((o, i) => { const [rr, qq] = o.split('|'); let cls = ''; if (done){ if (o === z.answer) cls = 'good'; else if (o === z.picked) cls = 'bad'; }
          return `<button class="key ${cls}" data-act="pick" data-v="${o}">${esc(this.name(+rr, qq))}<small>${i + 1}</small></button>`; }).join('')}</div>
        <div class="row"><button class="btn ghost" data-act="strum">Strum again</button><button class="btn" data-act="nextq" ${done ? '' : 'disabled'}>Next chord</button></div>
        <div class="stats"><div class="stat"><b>${sc.streak}</b><span>Streak</span></div><div class="stat"><b>${stats.chordBest || 0}</b><span>Best</span></div><div class="stat"><b>${sc.n ? Math.round(100 * sc.ok / sc.n) + '%' : '—'}</b><span>Accuracy</span></div><div class="stat"><b>${sc.n}</b><span>Answered</span></div></div>
      </div>
      <div class="card c5 stack">
        <div><p class="lbl">Chord types in the quiz</p><div class="row">${CQ_MAIN.map(k => chip('qq', k, k === 'maj' ? 'Major' : k === 'min' ? 'Minor' : CQ[k].sym, c.quizQ.includes(k))).join('')}</div></div>
        <p class="hint">Read the shape: find the root, usually on the lowest played string, then check whether the third is major or minor. Keys 1–4 pick an answer; Enter moves on.</p>
      </div>`;
  },
  cell(s, f){
    const c = S.chords;
    if (c.mode === 'quiz' && this.quiz){ const fr = this.quiz.vc.frets[s]; play(fr == null ? midiAt(s,f) : midiAt(s, fr)); return; }
    play(midiAt(s,f));
  },
  act(a, v){
    const c = S.chords;
    if (a === 'mode'){ c.mode = v; if (v === 'quiz') this.quiz = null; }
    if (a === 'root'){ c.root = +v; c.v = 0; }
    if (a === 'q'){ c.q = v; c.v = 0; }
    if (a === 'labels') c.labels = v;
    if (a === 'map') c.map = !c.map;
    if (a === 'capo') c.capo = +v;
    if (a === 'capokey') c.capoKey = +v;
    const n = genVoicings(c.root, c.q).length || 1;
    if (a === 'vprev') c.v = (c.v - 1 + n) % n;
    if (a === 'vnext') c.v = (c.v + 1) % n;
    if (a === 'strum'){
      const vc = c.mode === 'quiz' ? this.quiz && this.quiz.vc : genVoicings(c.root, c.q)[c.v];
      if (vc) strum(this.midis(vc)); return;
    }
    if (a === 'qq'){ if (c.quizQ.includes(v)){ if (c.quizQ.length > 1) c.quizQ = c.quizQ.filter(x => x !== v); } else c.quizQ.push(v); this.quiz = null; }
    if (a === 'pick' && this.quiz && this.quiz.picked == null){
      this.quiz.picked = v; const ok = v === this.quiz.answer, sc = this.score;
      sc.n++; if (ok){ sc.ok++; sc.streak++; if (sc.streak > (stats.chordBest || 0)){ stats.chordBest = sc.streak; saveStats(); } } else sc.streak = 0;
      strum(this.midis(this.quiz.vc)); haptic(ok ? 'success' : 'error');
    }
    if (a === 'nextq') this.quiz = null;
    if (['root','q','vprev','vnext'].includes(a) && c.mode === 'study'){ const vc = genVoicings(c.root, c.q)[c.v]; if (vc) strum(this.midis(vc)); }
    save(); this.render();
  },
  key(e){
    if (S.chords.mode !== 'quiz' || !this.quiz) return;
    if (/^[1-4]$/.test(e.key)){ const o = this.quiz.opts[+e.key - 1]; if (o){ e.preventDefault(); this.act('pick', o); } }
    if (e.key === 'Enter' && this.quiz.picked != null){ e.preventDefault(); this.act('nextq'); }
  }
};

/* ================= SCALES & KEYS ================= */
const Scales = {
  rootName(){ const sc = SCALES[S.scales.scale]; return KEY_ROOTS[sc.fam][S.scales.root]; },
  spelled(){ const rn = this.rootName(); return SCALES[S.scales.scale].iv.map(iv => spell(rn, iv)); },
  diatonic(){
    const sc = SCALES[S.scales.scale]; if (sc.iv.length !== 7) return null;
    const semis = sc.iv.map(iv => IV[iv]), names = this.spelled();
    return semis.map((st, i) => {
      const rel = k => (semis[(i + k) % 7] - st + 12) % 12;
      const key3 = rel(2) + ',' + rel(4), key7 = key3 + ',' + rel(6);
      const q = S.scales.sevenths ? SEV_Q[key7] : TRIAD_Q[key3];
      const deg = sc.iv[i], acc = deg.replace(/\d/g,'').replace(/b/g,'♭').replace(/#/g,'♯');
      let rn = ROMAN[i]; if (q && /^(min|dim|m7|m7b5|dim7|mMaj7)$/.test(q)) rn = rn.toLowerCase();
      const suf = { maj:'', min:'', dim:'°', aug:'+', maj7:'maj7', '7':'7', m7:'7', m7b5:'ø7', dim7:'°7', mMaj7:'(maj7)', maj7s5:'+maj7' }[q] ?? '';
      return { i, pc:(S.scales.root + st) % 12, name:names[i], q, roman: acc + rn + suf, rel:[0,2,4,6].slice(0, S.scales.sevenths ? 4 : 3).map(k => (st + rel(k)) % 12) };
    });
  },
  render(){
    const z = S.scales, sc = SCALES[z.scale], rn = this.rootName(), names = this.spelled();
    const pcs = sc.iv.map(iv => (z.root + IV[iv]) % 12);
    const dia = this.diatonic(); if (!dia) z.chordSel = null;
    const ch = dia && z.chordSel != null ? dia[z.chordSel] : null;
    const chPcs = ch ? CQ[ch.q].f.map(iv => (ch.pc + IV[iv]) % 12) : null;
    const M = [];
    for (const {s,f} of cellsIn([0,1,2,3,4,5], 0, FRETS)){
      const pc = pcOf(midiAt(s,f)), i = pcs.indexOf(pc); if (i < 0) continue;
      if (ch){
        const ci = chPcs.indexOf(pc);
        if (ci >= 0){ const civ = CQ[ch.q].f[ci]; M.push({s, f, pc, kind:'dot', root: pc === ch.pc, text: z.labels === 'int' ? ivDisp(civ) : names[i]}); }
        else M.push({s, f, pc, kind:'ghost', text: z.labels === 'int' ? ivDisp(sc.iv[i]) : names[i]});
      } else M.push({s, f, pc, kind:'dot', root: pc === z.root, text: z.labels === 'int' ? ivDisp(sc.iv[i]) : names[i]});
    }
    drawMarks(M);
    if (ch){ const base = 48 + ch.pc; renderPiano(hlNotes(this.voice(ch), { faintPcs: pcs }), ch.name + CQ[ch.q].sym); }
    else { const base = 48 + z.root; const ms = sc.iv.map(iv => base + IV[iv]).concat([base + 12]); renderPiano(hlNotes(ms, { faintPcs: pcs, labels:true }), rn + ' ' + sc.name.toLowerCase()); }
    const accs = names.filter(n => n.length > 1);
    const sigTxt = sc.iv.length === 7 && sc.parent != null ? (accs.length ? `${accs.length} ${accs[0].includes('♯') ? 'sharp' : 'flat'}${accs.length > 1 ? 's' : ''}: ${accs.join(' ')}` : 'No sharps or flats') : (accs.length ? `Accidentals: ${accs.join(' ')}` : 'No sharps or flats');
    $('#panel').innerHTML = `
      <div class="card c8 stack">
        <div><div class="chordname" style="font-size:40px">${rn} ${sc.name.toLowerCase()}</div><div class="sub">${sigTxt}</div>
          <div class="formula">${names.map((n, i) => `<div class="tone ${i === 0 ? 'r' : ''}"><b>${n}</b><span>${ivDisp(sc.iv[i])}</span></div>`).join('')}</div></div>
        <div class="row"><button class="btn" data-act="playscale">Play scale</button>${seg('labels', z.labels, [['int','Intervals'],['note','Note names']])}</div>
        <div><p class="lbl">Root</p><div class="row">${[...Array(12).keys()].map(p => chip('root', p, KEY_ROOTS[sc.fam][p], p === z.root, 'sq')).join('')}</div></div>
        <div><p class="lbl">Scale</p><div class="row">${Object.entries(SCALES).map(([k, v]) => chip('scale', k, v.name, k === z.scale)).join('')}</div></div>
        <div>
          <div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="lbl" style="margin:0">Chords in this key</p>${dia ? toggle('sev', 'Seventh chords', z.sevenths) : ''}</div>
          ${dia ? `<div class="dia">${dia.map(d => `<button data-act="chord" data-v="${d.i}" aria-pressed="${z.chordSel === d.i}"><b>${d.roman}</b><span>${esc(d.name + (d.q ? CQ[d.q].sym : ''))}</span></button>`).join('')}</div>
            <div class="row" style="margin-top:10px">${ch ? `<span class="sub">Showing ${esc(ch.name + CQ[ch.q].sym)} inside the scale. Faded dots are the other scale tones.</span><button class="btn ghost" data-act="toChords">See ${esc(ch.name + CQ[ch.q].sym)} voicings</button>` : `<span class="hint">Each chord is built by stacking every other note of the scale. Tap one to see it on the neck and hear it.</span>`}</div>`
          : `<p class="hint">${sc.name} has ${sc.iv.length} notes. Key chords come from seven-note scales, so pick Major, Natural minor or a mode to see them.</p>`}
        </div>
      </div>
      <div class="card c4 stack"><p class="lbl">Circle of fifths</p>${this.cof()}<p class="hint">Clockwise adds a sharp; counter-clockwise adds a flat. Neighbors share all but one note, and the inner ring holds each relative minor. Tap a key to load it.</p></div>`;
  },
  voice(ch){ let prev = 47; return ch.rel.map(pc => { let m = 36 + pc; while (m <= prev) m += 12; prev = m; return m; }); },

/* ================= MICROPHONE PITCH ================= */
const Mic = {
  stream:null, an:null, buf:null, timer:0, on:false, err:null, subs:new Set(), hist:[],
  async start(){
    if (this.on) return true;
    this.err = null;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error('nomic'), { name:'NotSupportedError' });
      const c = actx(); if (!c) throw new Error('noaudio');
      try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch(e){}
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      const srcN = c.createMediaStreamSource(this.stream);
      this.an = c.createAnalyser(); this.an.fftSize = 4096; srcN.connect(this.an);
      this.buf = new Float32Array(this.an.fftSize); this.on = true;
      this.timer = setInterval(() => this.tick(), 50);
      return true;
    } catch (e){ this.err = e && e.name || 'Error'; this.on = false; return false; }
  },
  stop(){ try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch(e){} clearInterval(this.timer); if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; this.on = false; this.hist = []; },
  floor:0.004, quietUntil:0,
  tick(){
    this.an.getFloatTimeDomainData(this.buf);
    // adaptive noise gate: track the room's quiet level, only listen well above it
    const gate = Math.max(0.01, this.floor * 3.2);
    const r = detectPitch(this.buf, ac.sampleRate, gate);
    if (r.f < 0 && r.rms < gate) this.floor = this.floor * 0.95 + r.rms * 0.05;
    const f = performance.now() < this.quietUntil ? -1 : r.f;
    if (f > 60 && f < 1400){ this.hist.push(f); if (this.hist.length > 5) this.hist.shift(); }
    else { this.hist = []; }
    const med = this.hist.length >= 3 ? [...this.hist].sort((a,b) => a - b)[this.hist.length >> 1] : -1;
    this.subs.forEach(fn => fn(med));
  },
  errText(){
    if (window.self !== window.top) return 'The microphone is not available inside this preview. Open Fretwise from its own address to use listening. Until then, tune by ear with the reference tones.';
    if (this.err === 'NotAllowedError') return 'Fretwise needs permission to use the microphone. Allow it in your browser’s site settings (on iPhone: Settings, Safari, Microphone), then try again.';
    if (this.err === 'NotFoundError') return 'No microphone was found on this device.';
    return 'The microphone could not start. Close other apps that are using it and try again.';
  }
};
// YIN pitch detector (de Cheveigné & Kawahara 2002) over a 2048-sample window; returns Hz or -1.
function detectPitch(b, sr, gate){
  const W = 2048, maxLag = Math.min(b.length - W, Math.floor(sr / 60)), minLag = Math.floor(sr / 1400);
  let rms = 0; for (let i = 0; i < W; i++) rms += b[i] * b[i]; rms = Math.sqrt(rms / W);
  if (rms < gate) return { f:-1, rms };
  const d = detectPitch.d && detectPitch.d.length >= maxLag + 1 ? detectPitch.d : (detectPitch.d = new Float32Array(maxLag + 1));
  d[0] = 1; let run = 0;
  for (let tau = 1; tau <= maxLag; tau++){
    let sum = 0; for (let i = 0; i < W; i++){ const x = b[i] - b[i + tau]; sum += x * x; }
    run += sum; d[tau] = run ? sum * tau / run : 1;
  }
  let tau = -1;
  for (let t = Math.max(2, minLag); t < maxLag; t++){ if (d[t] < 0.13){ while (t + 1 < maxLag && d[t + 1] < d[t]) t++; tau = t; break; } }
  if (tau < 0) return { f:-1, rms };
  const a = d[tau - 1], c0 = d[tau], c = d[tau + 1], den = a + c - 2 * c0;
  const t2 = den ? tau + (a - c) / (2 * den) : tau;
  return { f: sr / t2, rms, clarity: 1 - c0 };
}
const f2m = f => 69 + 12 * Math.log2(f / 440);

/* ---------- answer by playing your guitar ---------- */
const Ear = {
  fn:null, handler:null, armed:true, last:null, stable:0, silent:0,
  get on(){ return !!this.fn; },
  async toggle(handler){
    if (this.fn){ this.stop(); return false; }
    const ok = await Mic.start(); if (!ok){ toast(Mic.errText()); return false; }
    this.handler = handler; this.armed = true; this.last = null; this.fn = f => this.frame(f); Mic.subs.add(this.fn); return true;
  },
  frame(f){
    const el = document.getElementById('heard');
    if (f < 0){ if (++this.silent >= 3){ this.armed = true; this.last = null; this.stable = 0; if (el) el.textContent = 'Listening…'; } return; }
    this.silent = 0; const r = Math.round(f2m(f));
    if (el) el.textContent = 'Hearing ' + nn(pcOf(r));
    if (r === this.last) this.stable++; else { this.last = r; this.stable = 0; this.armed = true; }
    if (this.stable === 2 && this.armed){ this.armed = false; if (this.handler) this.handler(r); }
  },
  stop(){ if (this.fn){ Mic.subs.delete(this.fn); this.fn = null; } if (!Mic.subs.size && Mic.on) Mic.stop(); },
  button(act){ return `<div class="row" style="margin-top:8px">${chip(act, '', this.on ? 'Listening: play it on your guitar' : 'Answer by playing your guitar', this.on)}<span class="hint" id="heard">${this.on ? 'Listening…' : ''}</span></div>`; }
};

/* ================= LIFE-SIZE NECK ================= */

      c.strokeStyle = s < 4 ? C.wound : C.str; c.beginPath(); c.moveTo(this.sx(this.strX(s, -60)), this.sy(-60)); c.lineTo(this.sx(this.strX(s, end)), this.sy(end)); c.stroke();
    }
    // string names above the nut
    if (yTop < -20){ c.font = `600 ${Math.max(11, 2.6 * k)}px ${getComputedStyle(document.body).fontFamily}`; c.fillStyle = C.pearl; for (let s = 0; s < 6; s++) c.fillText(SNAME[s], this.sx(this.strX(s, -26)), this.sy(-26)); }
    const dot = (s, f, fill, label, ink, ring) => {

    };
    if (S.life.labels || S.life.type === 'free'){
      for (let s = 0; s < 6; s++) for (let f = 0; f <= FRETS; f++){ const pc = pcOf(midiAt(s, f)); if (S.life.nat && !NAT[pc]) continue; const y = this.along(f); if (y < yTop - 10 || y > yBot + 10) continue;

      dot(tp.s, tp.f, tp.ok === true ? C.good : tp.ok === false ? C.bad : noteFill(pc).replace('var(--pearl)', C.pearl), nn(pc), tp.ok === null ? '#1C1612' : '#fff'); c.globalAlpha = 1; }

    if (a > 0){
      c.strokeStyle = C.pearl; c.lineCap = 'round';
      for (let i = 0; i < 9; i++){ const x = W * ((i * 0.137 + 0.06) % 1), len = 40 + sp * .25, y = ((t * sp * 0.004 * (this.v > 0 ? -1 : 1) + i * 97) % (H + len) + H + len) % (H + len) - len;
        c.globalAlpha = a * (.10 + .08 * (i % 3)); c.lineWidth = 2 + (i % 3); c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + len); c.stroke(); }

    const ff = this.flashFret, fa = ff.n >= 0 ? Math.max(0, 1 - (t - ff.t) / 700) : 0;
    if (fa > 0 && ff.n > 0){ c.globalAlpha = fa * .9; c.fillStyle = C.ink; c.font = `800 ${Math.round(W * .28)}px ${getComputedStyle($('.logo')).fontFamily}`; c.fillText(ff.n, W / 2, H / 2); c.font = `600 14px ${getComputedStyle(document.body).fontFamily}`; c.fillText('FRET', W / 2, H / 2 + W * .17); c.globalAlpha = 1; }
    // minimap rail
    const rx = W - 16 - (parseFloat(getComputedStyle($('#life')).paddingRight) || 0), r0 = 120, r1 = H - 170, total = end + 48, my = mm => r0 + (mm + 48) / total * (r1 - r0);
    c.strokeStyle = C.line; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(rx, r0); c.lineTo(rx, r1); c.stroke(); c.lineCap = 'butt';
    c.fillStyle = C.muted; c.font = `500 9px ${getComputedStyle(document.body).fontFamily}`; c.textAlign = 'right';
    for (const n of [0,3,5,7,9,12,15]){ const y = my(n ? (mmPos(n - 1) + mmPos(n)) / 2 : -10); c.fillText(n, rx - 9, y); }
    c.fillStyle = C.amber; c.globalAlpha = .85; const w0 = my(yTop), w1 = my(Math.min(yBot, end + 30)); c.beginPath(); c.roundRect ? c.roundRect(rx - 5, w0, 10, Math.max(8, w1 - w0), 5) : c.rect(rx - 5, w0, 10, Math.max(8, w1 - w0)); c.fill(); c.globalAlpha = 1;
    if (this.hint){ c.fillStyle = C.good; for (const tg of this.targets()){ c.beginPath(); c.arc(rx, my(this.along(tg.f)), 3.5, 0, 7); c.fill(); } }
    c.textAlign = 'center';
    // edge arrows toward hinted targets that are off screen
    if (this.hint && this.auto == null){ const T = this.targets(), above = T.some(x => this.along(x.f) < yTop + 6), below = T.some(x => this.along(x.f) > yBot - 6), vis = T.some(x => { const y = this.along(x.f); return y >= yTop + 6 && y <= yBot - 6; });
      if (!vis){ c.fillStyle = C.amber; c.font = `700 14px ${getComputedStyle(document.body).fontFamily}`; const bob = Math.sin(t / 200) * 4;
        if (below) c.fillText('▼  Slide toward the body  ▼', W / 2, H - 150 + bob); else if (above) c.fillText('▲  Slide toward the nut  ▲', W / 2, 140 - bob); } }
    $('#lpos').textContent = yTop < 0 ? `Nut to fret ${this.fretAt(yBot)}` : `Frets ${this.fretAt(yTop)}–${this.fretAt(yBot)}`;
  },
  bind(){
    const cv = $('#lifecv');
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); this.auto = null; this.drag = { y:e.clientY, x:e.clientX, y0:e.clientY, t:performance.now(), moved:false }; this.v = 0; });
    cv.addEventListener('pointermove', e => { const d = this.drag; if (!d) return; const dy = e.clientY - d.y, now = performance.now();
      if (Math.abs(e.clientY - d.y0) > 8) d.moved = true;

const LifeTab = {

/* ---------- first-run walkthrough ---------- */
const WELCOME = [
  { t:'Learn the neck one string at a time', b:'Fretwise starts with the six open strings and adds a little at a time: one string, then the next, then bluegrass chords, rhythm and the number system. Pass a stage by getting answers right in a row.', art:'<svg viewBox="0 0 220 70" aria-hidden="true"><rect x="10" y="10" width="200" height="50" rx="4" style="fill:var(--wood-b)"/>' + [0,1,2,3,4,5].map(i => `<line x1="10" x2="210" y1="${15 + i * 8}" y2="${15 + i * 8}" style="stroke:${i > 3 ? 'var(--string)' : 'var(--wound)'};stroke-width:${2.2 - i * .25}"/>`).join('') + [55,95,130,160,188].map(x => `<line x1="${x}" x2="${x}" y1="10" y2="60" style="stroke:var(--fretwire);stroke-width:2"/>`).join('') + '<circle cx="75" cy="55" r="7" style="fill:var(--amber)"/></svg>' },
