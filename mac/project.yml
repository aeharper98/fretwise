# Fretwise for the Mac. The Xcode project is generated from this file (brew install xcodegen;
# xcodegen generate --spec mac/project.yml) and not committed. The app wraps the repo's web/ folder.
name: Fretwise
options:
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Fretwise:
    type: application
    platform: macOS
    sources:
      - path: Fretwise
      - path: ../web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aeharper98.fretwise
        PRODUCT_NAME: Fretwise
        INFOPLIST_FILE: Fretwise/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Fretwise/Fretwise.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: YES
    scheme: {}
